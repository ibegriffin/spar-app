<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sparglas</title>
<meta name="description" content="Gemeinsame Spar-Kasse für zwei.">
<meta name="theme-color" content="#1e7a60" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d4a3c" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sparglas">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex">

<style>
/* ---------------------------------------------------------------------------
   Sparglas — eine Datei, kein Framework, kein Build-Schritt.
   Aufbau: 1) Farben & Grundlagen  2) Kopf  3) Liste  4) Aktionen  5) Kisten
           6) Overlays (Buchen, Einrichten, Einstellungen, Kiste)  7) Hinweise
   --------------------------------------------------------------------------- */

/* 1) Farben & Grundlagen --------------------------------------------------- */
:root {
  --gruen-1: #1e7a60;
  --gruen-2: #0d4a3c;
  --ein: #0f6b46;
  --aus: #b0432c;
  --gold: #e9a83a;
  --pille: #ffffff;
  --pille-text: #14211c;

  --bg: #f1f4f2;
  --karte: #ffffff;
  --text: #14211c;
  --leise: #66786f;
  --linie: #e2e8e4;
  --schatten: 0 1px 2px rgba(16, 34, 27, .06), 0 8px 24px rgba(16, 34, 27, .06);

  --radius: 16px;
  --oben: env(safe-area-inset-top);
  --unten: env(safe-area-inset-bottom);
  --seite: max(16px, env(safe-area-inset-left));
}

@media (prefers-color-scheme: dark) {
  :root {
    --ein: #4cc38a;
    --aus: #f08a6c;
    --bg: #0e1512;
    --karte: #17211d;
    --text: #e7efeb;
    --leise: #93a49d;
    --linie: #25332d;
    --pille: #d7e7e0;
    --pille-text: #0f1d18;
    --schatten: 0 1px 2px rgba(0, 0, 0, .4);
  }
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  overscroll-behavior-y: none;
}

body {
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

@supports (height: 100dvh) {
  body { height: 100dvh; }
}

button, input, select {
  font: inherit;
  color: inherit;
}

button {
  border: 0;
  background: none;
  cursor: pointer;
}

:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
  border-radius: 6px;
}

.zahl { font-variant-numeric: tabular-nums; }
.versteckt { display: none !important; }

/* 2) Kopf ------------------------------------------------------------------ */
.kopf {
  flex: none;
  position: relative;
  padding: calc(var(--oben) + 14px) var(--seite) 20px;
  background: linear-gradient(160deg, var(--gruen-1), var(--gruen-2));
  color: #fff;
  z-index: 2;
}

.kopf-zeile {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 32px;
}

.marke {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: .01em;
  opacity: .92;
}

.marke img { width: 22px; height: 22px; border-radius: 6px; }

.kopf-knoepfe { display: flex; gap: 2px; }

.rund {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: #fff;
  opacity: .9;
}

.rund:active { background: rgba(255, 255, 255, .16); }
.rund svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

.saldo {
  margin: 10px 0 0;
  font-size: clamp(38px, 12vw, 52px);
  font-weight: 700;
  letter-spacing: -.02em;
  line-height: 1.05;
}

.stand {
  margin-top: 6px;
  font-size: 13px;
  opacity: .78;
  min-height: 19px;
}

/* Ladebalken am unteren Rand des Kopfes */
.laden {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 2px;
  overflow: hidden;
  opacity: 0;
  transition: opacity .2s;
}

.laden.an { opacity: 1; }

.laden::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(255, 255, 255, .85);
  transform: translateX(-100%);
  animation: schieben 1.1s ease-in-out infinite;
}

@keyframes schieben {
  0%   { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

/* 3) Liste ----------------------------------------------------------------- */
main {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 0 var(--seite) 12px;
}

.zieher {
  height: 0;
  display: grid;
  place-items: center;
  overflow: hidden;
  font-size: 13px;
  color: var(--leise);
  transition: height .18s ease;
}

.monat {
  position: sticky;
  top: 0;
  z-index: 1;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 4px 8px;
  background: linear-gradient(var(--bg) 70%, transparent);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--leise);
}

.monat-summe { text-transform: none; letter-spacing: 0; font-weight: 600; }

.gruppe {
  background: var(--karte);
  border-radius: var(--radius);
  box-shadow: var(--schatten);
  overflow: hidden;
}

.buchung {
  display: flex;
  align-items: baseline;
  gap: 12px;
  padding: 13px 16px;
  border-top: 1px solid var(--linie);
}

.gruppe .buchung:first-child { border-top: 0; }

.buchung-text { flex: 1; min-width: 0; }

.buchung-titel {
  overflow-wrap: anywhere;
  font-size: 15px;
}

.buchung-titel.ohne { color: var(--leise); }

.buchung-meta {
  margin-top: 2px;
  font-size: 12.5px;
  color: var(--leise);
}

.buchung-betrag {
  flex: none;
  font-size: 16px;
  font-weight: 650;
  white-space: nowrap;
}

.plus { color: var(--ein); }
.minus { color: var(--aus); }

.leer {
  margin-top: 22px;
  padding: 28px 20px;
  border: 1px dashed var(--linie);
  border-radius: var(--radius);
  text-align: center;
  color: var(--leise);
  font-size: 14.5px;
}

/* 4) Aktionen -------------------------------------------------------------- */
.aktionen {
  flex: none;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 10px var(--seite) calc(var(--unten) + 10px);
  background: var(--karte);
  border-top: 1px solid var(--linie);
}

.tat {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 54px;
  border-radius: 14px;
  font-size: 16.5px;
  font-weight: 600;
  color: #fff;
  background: var(--gruen-1);
  transition: transform .12s ease, filter .12s ease;
}

.tat.raus { background: #8a3a26; }
.tat:active { transform: scale(.98); filter: brightness(1.08); }
.tat svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }

@media (prefers-color-scheme: dark) {
  .tat { background: #1b6b54; }
  .tat.raus { background: #7c3421; }
}

/* 5) Kisten ---------------------------------------------------------------- */
/* Umschalter zwischen Sparglas und Kisten, sitzt im gruenen Kopf. */
.reiter {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px;
  margin-top: 14px;
  padding: 3px;
  border-radius: 11px;
  background: rgba(255, 255, 255, .16);
}

.reiter button {
  padding: 7px 4px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  color: #fff;
  opacity: .8;
  transition: background .16s ease, opacity .16s ease;
}

/* Die gewaehlte Pille muss im gruenen Kopf heller sein als der Grund — im
   Dunkelmodus ist die Kartenfarbe dafuer zu dunkel, deshalb ein eigenes Paar. */
.reiter button[aria-selected="true"] {
  background: var(--pille);
  color: var(--pille-text);
  opacity: 1;
}

.kzahl {
  margin-top: 14px;
  font-size: clamp(26px, 8vw, 34px);
  font-weight: 700;
  letter-spacing: -.02em;
  line-height: 1.1;
}

.kzahl small { font-size: 15px; font-weight: 600; opacity: .82; }

.balken {
  margin-top: 9px;
  height: 5px;
  border-radius: 3px;
  background: rgba(255, 255, 255, .22);
  overflow: hidden;
}

.balken i {
  display: block;
  height: 100%;
  width: 0;
  border-radius: 3px;
  background: var(--gold);
  transition: width .3s ease;
}

/* 16px verhindert, dass iOS beim Antippen in das Feld hineinzoomt. */
.suche {
  width: 100%;
  margin-top: 12px;
  padding: 11px 14px;
  border: 0;
  border-radius: 12px;
  background: var(--karte);
  color: var(--text);
  font-size: 16px;
  -webkit-appearance: none;
}

.suche::placeholder { color: var(--leise); }

.kfilter { display: flex; gap: 7px; margin-top: 10px; }

.kfilter button {
  padding: 5px 12px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  color: #fff;
  background: rgba(255, 255, 255, .16);
  opacity: .84;
}

.kfilter button[aria-pressed="true"] {
  background: var(--pille);
  color: var(--pille-text);
  opacity: 1;
}

/* Eine Zeile = zwei Knoepfe nebeneinander: oeffnen und abhaken. Verschachtelte
   Buttons sind in HTML nicht erlaubt, deshalb der Rahmen als div. */
.kiste {
  display: flex;
  align-items: center;
  border-top: 1px solid var(--linie);
}

.gruppe .kiste:first-child { border-top: 0; }

.kiste-haupt {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 4px 11px 14px;
  text-align: left;
}

.kiste-haupt:active { background: rgba(30, 122, 96, .07); }

.kiste-nr {
  flex: none;
  min-width: 42px;
  height: 34px;
  padding: 0 7px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  background: var(--bg);
  color: var(--ein);
  font-size: 16px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.kiste.fertig .kiste-nr { background: var(--linie); color: var(--leise); }

.kiste-text { flex: 1; min-width: 0; }

.kiste-titel { font-size: 15px; overflow-wrap: anywhere; }
.kiste.fertig .kiste-titel { color: var(--leise); }

.kiste-meta {
  margin-top: 2px;
  font-size: 12.5px;
  color: var(--leise);
  overflow-wrap: anywhere;
}

.kiste-meta mark {
  background: rgba(233, 168, 58, .32);
  color: inherit;
  border-radius: 3px;
  padding: 0 1px;
}

.haken {
  flex: none;
  width: 30px;
  height: 30px;
  margin: 0 12px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 1.8px solid var(--linie);
  color: transparent;
  transition: background .14s ease, border-color .14s ease;
}

.kiste.fertig .haken {
  border-color: var(--ein);
  background: var(--ein);
  color: #fff;
}

.haken svg {
  width: 16px; height: 16px;
  fill: none; stroke: currentColor;
  stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round;
}

.zerbrechlich {
  display: inline-block;
  margin-left: 6px;
  padding: 0 6px;
  border-radius: 999px;
  background: rgba(176, 67, 44, .13);
  color: var(--aus);
  font-size: 11.5px;
  font-weight: 600;
}

/* Kisten-Blatt */
.k-kopf { display: flex; align-items: center; gap: 12px; }
.k-kopf h2 { margin: 0; }
.k-sachen { margin: 14px 0 0; padding: 0; list-style: none; }

.k-sachen li {
  padding: 9px 0;
  border-top: 1px solid var(--linie);
  font-size: 15px;
}

.k-sachen li:first-child { border-top: 0; }
.k-sachen .kat { margin-top: 1px; color: var(--leise); font-size: 12.5px; }

.k-text {
  margin-top: 14px;
  padding: 12px 14px;
  border-radius: 12px;
  background: var(--karte);
  color: var(--leise);
  font-size: 13.5px;
}

/* 6) Overlays -------------------------------------------------------------- */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  background: rgba(8, 20, 16, .5);
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease;
}

.overlay.offen { opacity: 1; pointer-events: auto; }

.blatt {
  background: var(--bg);
  border-radius: 22px 22px 0 0;
  padding: 8px var(--seite) calc(var(--unten) + 16px);
  transform: translateY(16px);
  transition: transform .22s ease;
  max-height: 92%;
  overflow-y: auto;
}

.overlay.offen .blatt { transform: translateY(0); }

.griff {
  width: 40px;
  height: 4px;
  margin: 6px auto 12px;
  border-radius: 2px;
  background: var(--linie);
}

.blatt h2 {
  margin: 0 0 14px;
  font-size: 19px;
  font-weight: 650;
}

.feld { margin-bottom: 14px; }

.feld label {
  display: block;
  margin-bottom: 6px;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--leise);
}

.feld input {
  width: 100%;
  padding: 13px 14px;
  border: 1px solid var(--linie);
  border-radius: 12px;
  background: var(--karte);
  font-size: 17px;
  -webkit-appearance: none;
  appearance: none;
}

.feld input:focus { border-color: var(--gruen-1); outline: none; }

#betrag {
  font-size: 30px;
  font-weight: 650;
  letter-spacing: -.01em;
  text-align: center;
}

.vorschau {
  margin-top: 8px;
  text-align: center;
  font-size: 14px;
  color: var(--leise);
  min-height: 20px;
}

.wahl { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.wahl button {
  padding: 13px;
  border: 1.5px solid var(--linie);
  border-radius: 12px;
  background: var(--karte);
  font-size: 16px;
  font-weight: 600;
}

.wahl button[aria-pressed="true"] {
  border-color: var(--gruen-1);
  background: color-mix(in srgb, var(--gruen-1) 12%, var(--karte));
  color: var(--ein);
}

.absenden {
  width: 100%;
  min-height: 52px;
  margin-top: 4px;
  border-radius: 13px;
  background: var(--gruen-1);
  color: #fff;
  font-size: 16.5px;
  font-weight: 650;
}

.absenden.raus { background: #8a3a26; }
.absenden:disabled { opacity: .55; }

.abbrechen {
  width: 100%;
  padding: 14px;
  margin-top: 2px;
  color: var(--leise);
  font-size: 15.5px;
}

.fehler {
  margin: 0 0 12px;
  padding: 11px 13px;
  border-radius: 11px;
  background: color-mix(in srgb, var(--aus) 14%, var(--karte));
  color: var(--aus);
  font-size: 14.5px;
}

.hilfe {
  margin: -4px 0 16px;
  color: var(--leise);
  font-size: 14px;
}

/* Einrichtung füllt den Bildschirm statt am unteren Rand zu kleben */
#einrichten { justify-content: center; background: var(--bg); }
#einrichten .blatt { border-radius: 0; background: none; padding-top: calc(var(--oben) + 24px); }
#einrichten .glas { display: block; width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 16px; }
#einrichten h2 { text-align: center; }

/* 7) Hinweise -------------------------------------------------------------- */
.hinweis {
  flex: none;
  padding: 9px var(--seite);
  background: color-mix(in srgb, var(--gold) 22%, var(--bg));
  color: var(--text);
  font-size: 13px;
  text-align: center;
  border-bottom: 1px solid var(--linie);
}

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--unten) + 88px);
  z-index: 20;
  padding: 11px 18px;
  border-radius: 999px;
  background: rgba(20, 33, 28, .94);
  color: #fff;
  font-size: 14.5px;
  font-weight: 550;
  white-space: nowrap;
  transform: translate(-50%, 12px);
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
}

.toast.an { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  *, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}
</style>
</head>

<body>

<header class="kopf">
  <div class="kopf-zeile">
    <span class="marke"><img src="icon-32.png" alt="" width="22" height="22">Sparglas</span>
    <span class="kopf-knoepfe">
      <button class="rund" id="btn-neu" aria-label="Aktualisieren">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4"/></svg>
      </button>
      <button class="rund" id="btn-menu" aria-label="Einstellungen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg>
      </button>
    </span>
  </div>
  <div class="reiter" id="reiter" role="tablist" aria-label="Bereich">
    <button type="button" role="tab" data-bereich="spar" aria-selected="true">Sparglas</button>
    <button type="button" role="tab" data-bereich="kisten" aria-selected="false">Kisten</button>
  </div>

  <div id="kopf-spar">
    <div class="saldo zahl" id="saldo" aria-live="polite">—</div>
  </div>

  <div id="kopf-kisten" class="versteckt">
    <div class="kzahl zahl" id="kisten-zahl" aria-live="polite">—</div>
    <div class="balken"><i id="kisten-balken"></i></div>
    <input id="suche" class="suche" type="search" enterkeyhint="search" autocomplete="off"
           autocapitalize="none" spellcheck="false" placeholder="Wonach suchst du?"
           aria-label="Kisten durchsuchen">
    <div class="kfilter" id="kfilter">
      <button type="button" data-filter="alle" aria-pressed="true">Alle</button>
      <button type="button" data-filter="offen" aria-pressed="false">Offen</button>
      <button type="button" data-filter="fertig" aria-pressed="false">Ausgepackt</button>
    </div>
  </div>

  <div class="stand" id="stand"></div>
  <div class="laden" id="laden" aria-hidden="true"></div>
</header>

<div class="hinweis versteckt" id="hinweis"></div>

<main id="liste-bereich">
  <div class="zieher" id="zieher" aria-hidden="true"></div>
  <div id="liste"></div>
  <div id="kisten-liste" class="versteckt"></div>
</main>

<div class="aktionen" id="aktionen">
  <button class="tat" id="btn-ein">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Einzahlen
  </button>
  <button class="tat raus" id="btn-aus">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>Entnehmen
  </button>
</div>

<!-- Buchen -->
<div class="overlay" id="buchen" role="dialog" aria-modal="true" aria-labelledby="buchen-titel">
  <div class="blatt">
    <div class="griff"></div>
    <h2 id="buchen-titel">Einzahlen</h2>
    <p class="fehler versteckt" id="buchen-fehler"></p>
    <div class="feld">
      <input id="betrag" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done"
             placeholder="0,00" aria-label="Betrag in Euro">
      <div class="vorschau zahl" id="betrag-vorschau"></div>
    </div>
    <div class="feld">
      <label for="kommentar">Kommentar (optional)</label>
      <input id="kommentar" type="text" autocomplete="off" enterkeyhint="done" placeholder="z. B. Urlaubskasse">
    </div>
    <button class="absenden" id="btn-buchen">Einzahlen</button>
    <button class="abbrechen" data-schliessen>Abbrechen</button>
  </div>
</div>

<!-- Einrichten (erster Start) -->
<div class="overlay" id="einrichten" role="dialog" aria-modal="true" aria-labelledby="einrichten-titel">
  <div class="blatt">
    <img class="glas" src="icon-180.png" alt="" width="64" height="64">
    <h2 id="einrichten-titel">Willkommen im Sparglas</h2>
    <p class="hilfe">Einmal pro Gerät: Familien-Code eingeben und Namen wählen.</p>
    <p class="fehler versteckt" id="einrichten-fehler"></p>
    <div class="feld">
      <label for="code">Familien-Code</label>
      <input id="code" type="text" autocomplete="off" autocapitalize="none" spellcheck="false"
             enterkeyhint="done" placeholder="Code aus dem Chat">
    </div>
    <div class="feld">
      <label>Wer bucht auf diesem iPhone?</label>

<script>
"use strict";

/* ===========================================================================
   EINSTELLUNG — hier trägt die Session nach Phase 2 die Apps-Script-URL ein.
   Solange der Wert leer ist, läuft die App im Vorschau-Modus mit Beispieldaten.
   Die URL endet auf /exec. Der Familien-Code steht NIE in dieser Datei.
   =========================================================================== */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzEQP8iuYzQMRav2ZyK_SUv1Hujf75-g1wygA9qXUPYRCb2BhlUWhBGUeWgoEPZLvTjLA/exec";

const MOCK = SCRIPT_URL === "";
const SPEICHER = {
  code: "sparglas.code",
  wer: "sparglas.wer",
  stand: "sparglas.stand",
  mock: "sparglas.mockdaten",
  kisten: "sparglas.kisten",
  bereich: "sparglas.bereich",
  mockKisten: "sparglas.mockkisten"
};

/* --- kleine Helfer -------------------------------------------------------- */
const $ = (id) => document.getElementById(id);

const euroFormat = new Intl.NumberFormat("de-DE", { style: "currency", currency: "EUR" });
const monatFormat = new Intl.DateTimeFormat("de-DE", { month: "long", year: "numeric" });
const datumFormat = new Intl.DateTimeFormat("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" });
const uhrFormat = new Intl.DateTimeFormat("de-DE", { hour: "2-digit", minute: "2-digit" });

function euro(n) {
  return euroFormat.format(n);
}

function euroMitZeichen(n) {
  return (n < 0 ? "−" : "+") + euroFormat.format(Math.abs(n));
}

function lies(schluessel, standard) {
  try {
    const roh = localStorage.getItem(schluessel);
    return roh === null ? standard : JSON.parse(roh);
  } catch (e) {
    return standard;
  }
}

function schreibe(schluessel, wert) {
  try {
    localStorage.setItem(schluessel, JSON.stringify(wert));
  } catch (e) { /* z. B. voller Speicher — nicht kritisch */ }
}

function uuid() {
  if (self.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function (c) {
    const r = Math.random() * 16 | 0;
    return (c === "x" ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

/** „12,50“, „1.234,56“ und „12.5“ ergeben alle eine Zahl; sonst NaN. */
function betragLesen(text) {
  let s = String(text).replace(/[\s €]/g, "");
  if (s === "") return NaN;
  const hatKomma = s.indexOf(",") >= 0;
  const hatPunkt = s.indexOf(".") >= 0;
  if (hatKomma && hatPunkt) {
    s = s.replace(/\./g, "").replace(",", ".");       // 1.234,56
  } else if (hatKomma) {
    s = s.replace(",", ".");                          // 12,50
  } else if (hatPunkt) {
    const teile = s.split(".");
    const letzter = teile[teile.length - 1];
    if (teile.length > 2 || letzter.length === 3) s = teile.join("");  // 1.234 = Tausender
  }
  if (!/^-?\d*\.?\d*$/.test(s)) return NaN;
  const zahl = Number(s);
  return isFinite(zahl) ? Math.round(Math.abs(zahl) * 100) / 100 : NaN;
}

/**
 * Zeitstempel aus dem Sheet in ein Datum verwandeln.
 * Normalfall ist ISO-Text. Apps Script kann aber auch einen englischen
 * Datumstext liefern („Thu Aug 06 2026 11:56:14 GMT+0200 (Mitteleuropäische
 * Sommerzeit)“) — den versteht nicht jeder Browser von sich aus, deshalb die
 * beiden Rückfallebenen.
 */
function alsDatum(ts) {
  const direkt = new Date(ts);
  if (!isNaN(direkt)) return direkt;

  const ohneKlammer = String(ts).replace(/\s*\([^)]*\)\s*$/, "");
  const zweiter = new Date(ohneKlammer);
  if (!isNaN(zweiter)) return zweiter;

  const teile = /([A-Za-z]{3})\s+(\d{1,2})\s+(\d{4})\s+(\d{1,2}):(\d{2}):(\d{2})(?:\s*GMT([+-])(\d{2})(\d{2}))?/.exec(ohneKlammer);
  if (teile) {
    const monate = { Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5, Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11 };
    const monat = monate[teile[1]];
    if (monat !== undefined) {
      const ms = Date.UTC(+teile[3], monat, +teile[2], +teile[4], +teile[5], +teile[6]);
      const versatz = teile[7] ? (teile[7] === "-" ? -1 : 1) * ((+teile[8]) * 60 + (+teile[9])) : 0;
      return new Date(ms - versatz * 60000);
    }
  }
  return direkt;   // ungültig — die Buchung landet dann unter „Ohne Datum“
}

function zeitpunktText(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return "";
  const heute = new Date();
  const gleicherTag = (a, b) => a.toDateString() === b.toDateString();
  const gestern = new Date(heute.getTime() - 86400000);
  if (gleicherTag(d, heute)) return "heute, " + uhrFormat.format(d) + " Uhr";
  if (gleicherTag(d, gestern)) return "gestern, " + uhrFormat.format(d) + " Uhr";
  return datumFormat.format(d) + ", " + uhrFormat.format(d) + " Uhr";
}

/* --- Zustand -------------------------------------------------------------- */
let zustand = null;      // { startSaldo, saldo, buchungen: [...] }
let standGeladenAm = null;  // ISO-Zeitpunkt des letzten Sparstand-Ladens
let laeuft = false;      // gerade ein Request unterwegs?
let modus = "ein";       // aktueller Buchungs-Modus im Blatt
let laufendeId = null;   // UUID der Buchung im Blatt (überlebt Fehlversuche)

let bereich = "spar";       // sichtbarer Reiter: "spar" oder "kisten"
let kisten = null;          // { kisten: [...], sachen: [...] }
let kistenGeladenAm = null; // ISO-Zeitpunkt des letzten Kisten-Ladens
let suchtext = "";          // Inhalt des Suchfelds
let kFilter = "alle";       // "alle" | "offen" | "fertig"
let offeneKiste = null;     // Nummer der Kiste im Blatt

/* --- Server-Zugriff ------------------------------------------------------- */
async function ruf(nutzlast) {
  if (MOCK) return mockRuf(nutzlast);

  const abbruch = new AbortController();
  const wecker = setTimeout(() => abbruch.abort(), 25000);
  try {
    const antwort = await fetch(SCRIPT_URL, {
      method: "POST",
      // text/plain vermeidet den CORS-Preflight, den Apps Script nicht beantwortet.
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(nutzlast),
      signal: abbruch.signal
    });
    const text = await antwort.text();
    try {
      return JSON.parse(text);
    } catch (e) {
      return { ok: false, error: "antwort" };   // meist eine Google-Fehlerseite
    }
  } finally {
    clearTimeout(wecker);
  }
}

/* Vorschau-Modus: hält Beispieldaten im localStorage, damit sich die App
   schon vor dem Google-Setup echt bedienen lässt. */
function mockRuf(nutzlast) {
  return new Promise((fertig) => {
    setTimeout(() => {
      if (nutzlast.action === "kisten" || nutzlast.action === "kiste") {
        return fertig(mockKisten(nutzlast));
      }
      const daten = lies(SPEICHER.mock, null) || mockStart();
      if (nutzlast.action === "add") {
        const betrag = Number(nutzlast.betrag);
        if (!isFinite(betrag) || betrag === 0) return fertig({ ok: false, error: "betrag" });
        if (!daten.buchungen.some((b) => b.id === nutzlast.id)) {
          daten.buchungen.push({
            id: nutzlast.id,
            ts: new Date().toISOString(),
            betrag: betrag,
            kommentar: String(nutzlast.kommentar || ""),
            wer: String(nutzlast.wer || "")
          });
        }
        schreibe(SPEICHER.mock, daten);
      }
      const saldo = daten.buchungen.reduce((s, b) => s + b.betrag, daten.startSaldo);
      fertig({ ok: true, startSaldo: daten.startSaldo, saldo: saldo, buchungen: daten.buchungen });
    }, 450);
  });
}

function mockStart() {
  const jetzt = Date.now();
  const tag = 86400000;
  const daten = {
    startSaldo: 500,
    buchungen: [
      { id: uuid(), ts: new Date(jetzt - 47 * tag).toISOString(), betrag: 200, kommentar: "Juni-Rate", wer: "Indir" },
      { id: uuid(), ts: new Date(jetzt - 41 * tag).toISOString(), betrag: -64.9, kommentar: "Reifen", wer: "Luca" },
      { id: uuid(), ts: new Date(jetzt - 22 * tag).toISOString(), betrag: 200, kommentar: "Juli-Rate", wer: "Luca" },
      { id: uuid(), ts: new Date(jetzt - 9 * tag).toISOString(), betrag: 75, kommentar: "", wer: "Indir" },
      { id: uuid(), ts: new Date(jetzt - 2 * tag).toISOString(), betrag: -38.4, kommentar: "Essen bestellt", wer: "Indir" }
    ]
  };
  schreibe(SPEICHER.mock, daten);
  return daten;
}

function mockKisten(nutzlast) {
  const daten = lies(SPEICHER.mockKisten, null) || mockKistenStart();
  if (nutzlast.action === "kiste") {
    const nr = Number(nutzlast.nr);
    for (const k of daten.kisten) if (k.nr === nr) k.status = String(nutzlast.status || "");
    schreibe(SPEICHER.mockKisten, daten);
  }
  return { ok: true, kisten: daten.kisten, sachen: daten.sachen };
}

function mockKistenStart() {
  const daten = {
    kisten: [
      { nr: 3,  raum: "Schlafzimmer",  notiz: "", status: "", text: "Box 3 Schlafzimmer, Bettwäsche und Handtücher." },
      { nr: 12, raum: "Küche",         notiz: "", status: "ausgepackt", text: "Box 12 Küche, Töpfe und Pfannen, zwei Auflaufformen." },
      { nr: 21, raum: "Arbeitszimmer", notiz: "zuerst auspacken", status: "", text: "Box 21 Arbeitszimmer, Kabel, Ladegeräte, Bohrmaschine mit Zubehör." },
      { nr: 47, raum: "Küche",         notiz: "", status: "", text: "Box 47 Küche, Wasserkocher, Kaffeemühle und die guten Gläser." },
      { nr: 85, raum: "Keller",        notiz: "Küchensachen", status: "", text: "Box 85 Küche aus dem Keller, elektrische Wärmeplatte, Kontaktgrill von Tefal, große Käseglocke, Tortenanrichteteller und großes Grillbesteck." }
    ],
    sachen: [
      { nr: 3,  sache: "Bettwäsche",              kategorie: "Textil",   zerbrechlich: false },
      { nr: 3,  sache: "Handtücher",              kategorie: "Textil",   zerbrechlich: false },
      { nr: 12, sache: "Töpfe",                   kategorie: "Kochen",   zerbrechlich: false },
      { nr: 12, sache: "Pfannen",                 kategorie: "Kochen",   zerbrechlich: false },
      { nr: 12, sache: "Auflaufformen",           kategorie: "Kochen",   zerbrechlich: true },
      { nr: 21, sache: "Kabel",                   kategorie: "Technik",  zerbrechlich: false },
      { nr: 21, sache: "Ladegeräte",              kategorie: "Technik",  zerbrechlich: false },
      { nr: 21, sache: "Bohrmaschine mit Zubehör", kategorie: "Werkzeug", zerbrechlich: false },
      { nr: 47, sache: "Wasserkocher",            kategorie: "Küche",    zerbrechlich: false },
      { nr: 47, sache: "Kaffeemühle",             kategorie: "Küche",    zerbrechlich: false },
      { nr: 47, sache: "Gläser",                  kategorie: "Geschirr", zerbrechlich: true },
      { nr: 85, sache: "elektrische Wärmeplatte", kategorie: "Küche",    zerbrechlich: false },
      { nr: 85, sache: "Kontaktgrill von Tefal",  kategorie: "Küche",    zerbrechlich: false },
      { nr: 85, sache: "große Käseglocke",        kategorie: "Geschirr", zerbrechlich: true },
      { nr: 85, sache: "Tortenanrichteteller",    kategorie: "Geschirr", zerbrechlich: true },
      { nr: 85, sache: "großes Grillbesteck",     kategorie: "Küche",    zerbrechlich: false }
    ]
  };
  schreibe(SPEICHER.mockKisten, daten);
  return daten;
}

/* --- Laden & Buchen ------------------------------------------------------- */
function ladeAnzeige(an) {
  laeuft = an;
  $("laden").classList.toggle("an", an);
  $("btn-neu").disabled = an;
}

async function ladeStand(still) {
  const code = lies(SPEICHER.code, "");
  if (!code) return;
  if (!still) ladeAnzeige(true);
  try {
    const antwort = await ruf({ action: "state", code: code });
    if (antwort && antwort.ok) {
      uebernimm(antwort);
    } else if (antwort && antwort.error === "code") {
      codeAbgelehnt();
    } else {
      standHinweis(true);
    }
  } catch (e) {
    standHinweis(true);
  } finally {
    ladeAnzeige(false);
  }
}

function uebernimm(antwort) {
  zustand = {
    startSaldo: Number(antwort.startSaldo) || 0,
    saldo: Number(antwort.saldo) || 0,
    buchungen: Array.isArray(antwort.buchungen) ? antwort.buchungen : []
  };
  standGeladenAm = new Date().toISOString();
  schreibe(SPEICHER.stand, { zustand: zustand, geladenAm: standGeladenAm });
  zeichne();
}

function standHinweis(fehler) {
  const el = $("stand");
  const geladenAm = bereich === "kisten" ? kistenGeladenAm : standGeladenAm;
  if (!geladenAm) {
    el.textContent = fehler ? "Kein Kontakt zum Sheet — bitte erneut aktualisieren." : "";
    return;
  }
  if (fehler) {
    el.textContent = "Kein Kontakt — Stand von " + zeitpunktText(geladenAm);
    return;
  }
  const alter = Date.now() - new Date(geladenAm).getTime();
  el.textContent = alter < 60000 ? "gerade aktualisiert" : "Stand von " + zeitpunktText(geladenAm);
}

async function buche() {
  const betrag = betragLesen($("betrag").value);
  if (!isFinite(betrag) || betrag <= 0) {
    blattFehler("Bitte einen Betrag eingeben, z. B. 12,50.");
    $("betrag").focus();
    return;
  }
  blattFehler("");
  $("btn-buchen").disabled = true;
  ladeAnzeige(true);
  const vorzeichenBetrag = modus === "ein" ? betrag : -betrag;
  try {
    const antwort = await ruf({
      action: "add",
      code: lies(SPEICHER.code, ""),
      id: laufendeId,
      betrag: vorzeichenBetrag,
      kommentar: $("kommentar").value.trim(),
      wer: lies(SPEICHER.wer, "")
    });
    if (antwort && antwort.ok) {
      uebernimm(antwort);
      overlayZu("buchen");
      toast(euroMitZeichen(vorzeichenBetrag) + " gebucht");
    } else if (antwort && antwort.error === "code") {
      overlayZu("buchen");
      codeAbgelehnt();
    } else if (antwort && antwort.error === "betrag") {
      blattFehler("Der Betrag wurde nicht akzeptiert.");
    } else {
      blattFehler("Nicht gebucht — bitte erneut versuchen.");
    }
  } catch (e) {
    blattFehler("Nicht gebucht — bitte erneut versuchen.");
  } finally {
    $("btn-buchen").disabled = false;
    ladeAnzeige(false);
  }
}

function codeAbgelehnt() {
  localStorage.removeItem(SPEICHER.code);
  einrichtenOeffnen("Der Familien-Code stimmt nicht. Bitte noch einmal eingeben.");
}

/* --- Zeichnen ------------------------------------------------------------- */
function zeichne() {
  $("saldo").textContent = zustand ? euro(zustand.saldo) : "—";
  standHinweis(false);

  const ziel = $("liste");
  if (!zustand) { ziel.innerHTML = ""; return; }

  const sortiert = zustand.buchungen
    .slice()
    .sort((a, b) => alsDatum(b.ts) - alsDatum(a.ts));

  if (sortiert.length === 0) {
    ziel.innerHTML = "";
    const leer = document.createElement("div");
    leer.className = "leer";
    leer.textContent = "Noch keine Buchungen. Startsaldo: " + euro(zustand.startSaldo) + ".";
    ziel.appendChild(leer);
    return;
  }

  // nach Monat gruppieren, neueste zuerst
  const gruppen = [];
  let aktuell = null;
  for (const b of sortiert) {
    const d = alsDatum(b.ts);
    const schluessel = isNaN(d) ? "?" : d.getFullYear() + "-" + d.getMonth();
    if (!aktuell || aktuell.schluessel !== schluessel) {
      aktuell = {
        schluessel: schluessel,
        titel: isNaN(d) ? "Ohne Datum" : monatFormat.format(d),
        summe: 0,
        eintraege: []
      };
      gruppen.push(aktuell);
    }
    aktuell.summe += Number(b.betrag) || 0;
    aktuell.eintraege.push(b);
  }

  const teil = document.createDocumentFragment();
  for (const g of gruppen) {
    const kopf = document.createElement("div");
    kopf.className = "monat";
    const name = document.createElement("span");
    name.textContent = g.titel;
    const summe = document.createElement("span");
    summe.className = "monat-summe zahl " + (g.summe < 0 ? "minus" : "plus");
    summe.textContent = euroMitZeichen(g.summe);
    kopf.append(name, summe);

    const box = document.createElement("div");
    box.className = "gruppe";
    for (const b of g.eintraege) box.appendChild(zeile(b));

    teil.append(kopf, box);
  }
  ziel.replaceChildren(teil);
}

function zeile(b) {
  const betrag = Number(b.betrag) || 0;
  const d = alsDatum(b.ts);

  const el = document.createElement("div");
  el.className = "buchung";

  const text = document.createElement("div");
  text.className = "buchung-text";

  const titel = document.createElement("div");
  const kommentar = String(b.kommentar || "").trim();
  titel.className = "buchung-titel" + (kommentar ? "" : " ohne");
  titel.textContent = kommentar || (betrag < 0 ? "Entnahme" : "Einzahlung");

  const meta = document.createElement("div");
  meta.className = "buchung-meta";
  const teile = [];
  if (!isNaN(d)) teile.push(datumFormat.format(d));
  const wer = String(b.wer || "").trim();
  if (wer) teile.push(wer);
  meta.textContent = teile.join(" · ");

  text.append(titel, meta);

  const zahl = document.createElement("div");
  zahl.className = "buchung-betrag zahl " + (betrag < 0 ? "minus" : "plus");
  zahl.textContent = euroMitZeichen(betrag);

  el.append(text, zahl);
  return el;
}

/* --- Kisten --------------------------------------------------------------- */

/**
 * Text zum Vergleichen einebnen: klein schreiben, Umlaute entzerren
 * („Küche“ → „kuche“). Die Länge bleibt dabei gleich — deshalb passen die
 * Positionen aus indexOf auch auf den Originaltext, was markiere() braucht.
 */
function flach(text) {
  const roh = String(text === null || text === undefined ? "" : text).toLowerCase();
  try {
    return roh.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  } catch (e) {
    return roh;   // sehr alte Engines: dann eben ohne Umlaut-Einebnung
  }
}

/** Steckt q in text? „ß“ und „ss“ gelten dabei als dasselbe. */
function passt(text, q) {
  if (!q) return true;
  const t = flach(text);
  if (t.indexOf(q) >= 0) return true;
  return t.replace(/ß/g, "ss").indexOf(q.replace(/ß/g, "ss")) >= 0;
}

/** Fundstellen im Text hervorheben. Findet nichts → gibt den Text unverändert. */
function markiere(text, q) {
  const teil = document.createDocumentFragment();
  const roh = String(text === null || text === undefined ? "" : text);
  if (!q) { teil.append(roh); return teil; }

  const eben = flach(roh);
  let ab = 0;
  let pos = eben.indexOf(q);
  while (pos >= 0) {
    if (pos > ab) teil.append(roh.slice(ab, pos));
    const m = document.createElement("mark");
    m.textContent = roh.slice(pos, pos + q.length);
    teil.append(m);
    ab = pos + q.length;
    pos = eben.indexOf(q, ab);
  }
  teil.append(roh.slice(ab));
  return teil;
}

function istFertig(k) {
  return String((k && k.status) || "") === "ausgepackt";
}

function sachenDerKiste(nr) {
  return kisten ? kisten.sachen.filter(function (s) { return s.nr === nr; }) : [];
}

async function ladeKisten(still) {
  const code = lies(SPEICHER.code, "");
  if (!code) return;
  if (!still) ladeAnzeige(true);
  try {
    const antwort = await ruf({ action: "kisten", code: code });
    if (antwort && antwort.ok) {
      uebernimmKisten(antwort);
    } else if (antwort && antwort.error === "code") {
      codeAbgelehnt();
    } else {
      standHinweis(true);
    }
  } catch (e) {
    standHinweis(true);
  } finally {
    ladeAnzeige(false);
  }
}

function uebernimmKisten(antwort) {
  kisten = {
    kisten: Array.isArray(antwort.kisten) ? antwort.kisten : [],
    sachen: Array.isArray(antwort.sachen) ? antwort.sachen : []
  };
  kistenGeladenAm = new Date().toISOString();
  schreibe(SPEICHER.kisten, { kisten: kisten, geladenAm: kistenGeladenAm });
  zeichneKisten();
  if (bereich === "kisten") standHinweis(false);
}

function gruppenKopf(titel, rechts) {
  const kopf = document.createElement("div");
  kopf.className = "monat";
  const links = document.createElement("span");
  links.textContent = titel;
  const seite = document.createElement("span");
  seite.className = "monat-summe";
  seite.textContent = rechts || "";
  kopf.append(links, seite);
  return kopf;
}

function leerText(text) {
  const el = document.createElement("div");
  el.className = "leer";
  el.textContent = text;
  return el;
}

function zeichneKisten() {
  const zahl = $("kisten-zahl");
  const ziel = $("kisten-liste");

  if (!kisten) {
    zahl.textContent = "—";
    $("kisten-balken").style.width = "0%";
    ziel.replaceChildren();
    return;
  }

  const alle = kisten.kisten.slice().sort(function (a, b) { return a.nr - b.nr; });
  const fertige = alle.filter(istFertig).length;

  zahl.replaceChildren();
  if (alle.length) {
    zahl.append(String(fertige) + " ");
    const rest = document.createElement("small");
    rest.textContent = "von " + alle.length + " ausgepackt";
    zahl.append(rest);
  } else {
    zahl.textContent = "—";
  }
  $("kisten-balken").style.width = alle.length
    ? Math.round(fertige / alle.length * 100) + "%"
    : "0%";

  const q = flach(suchtext.trim());
  const gefiltert = alle.filter(function (k) {
    if (kFilter === "offen" && istFertig(k)) return false;
    if (kFilter === "fertig" && !istFertig(k)) return false;
    if (!q) return true;
    if (String(k.nr) === q) return true;
    if (passt(k.raum, q) || passt(k.notiz, q) || passt(k.text, q)) return true;
    return sachenDerKiste(k.nr).some(function (sa) { return passt(sa.sache, q); });
  });

  if (!alle.length) {
    ziel.replaceChildren(leerText("Noch keine Kisten im Sheet. Sobald die Aufnahmen eingelesen sind, stehen sie hier."));
    return;
  }
  if (!gefiltert.length) {
    ziel.replaceChildren(leerText(q
      ? "Nichts gefunden für „" + suchtext.trim() + "“."
      : "In dieser Ansicht ist gerade nichts."));
    return;
  }

  const teil = document.createDocumentFragment();

  if (q) {
    teil.append(gruppenKopf(gefiltert.length === 1 ? "1 Treffer" : gefiltert.length + " Treffer", ""));
    const kasten = document.createElement("div");
    kasten.className = "gruppe";
    for (const k of gefiltert) kasten.appendChild(kistenZeile(k, q));
    teil.append(kasten);
  } else {
    // Ohne Suche nach Zielraum gruppieren — so packt man ein Zimmer am Stück aus.
    const namen = [];
    const nachRaum = Object.create(null);
    for (const k of gefiltert) {
      const name = k.raum || "Ohne Raum";
      if (!nachRaum[name]) { nachRaum[name] = []; namen.push(name); }
      nachRaum[name].push(k);
    }
    namen.sort(function (a, b) { return a.localeCompare(b, "de"); });
    for (const name of namen) {
      const liste = nachRaum[name];
      const offen = liste.filter(function (k) { return !istFertig(k); }).length;
      teil.append(gruppenKopf(name, offen ? offen + " offen" : "fertig"));
      const kasten = document.createElement("div");
      kasten.className = "gruppe";
      for (const k of liste) kasten.appendChild(kistenZeile(k, ""));
      teil.append(kasten);
    }
  }

  ziel.replaceChildren(teil);
}

function kistenZeile(k, q) {
  const fertig = istFertig(k);

  const el = document.createElement("div");
  el.className = "kiste" + (fertig ? " fertig" : "");

  const haupt = document.createElement("button");
  haupt.type = "button";
  haupt.className = "kiste-haupt";
  haupt.dataset.nr = String(k.nr);
  haupt.setAttribute("aria-label", "Kiste " + k.nr + " öffnen");

  const nr = document.createElement("span");
  nr.className = "kiste-nr";
  nr.textContent = String(k.nr);

  const text = document.createElement("div");
  text.className = "kiste-text";

  // Oben steht der Inhalt, darunter der Raum: ohne Suche gruppiert die Liste
  // ohnehin nach Raum, und gesucht wird immer nach dem Gegenstand.
  const titel = document.createElement("div");
  titel.className = "kiste-titel";
  const sachen = sachenDerKiste(k.nr);
  const treffer = q ? sachen.filter(function (sa) { return passt(sa.sache, q); }) : [];
  const quelle = treffer.length ? treffer : sachen;
  const zeigen = quelle.slice(0, 3);
  if (zeigen.length) {
    zeigen.forEach(function (sa, i) {
      if (i) titel.append(", ");
      titel.append(markiere(sa.sache, q));
    });
    if (quelle.length > zeigen.length) titel.append(" +" + (quelle.length - zeigen.length));
  } else if (k.notiz) {
    titel.append(markiere(k.notiz, q));
  } else {
    titel.append(markiere(k.raum || "Kiste " + k.nr, q));
  }

  const meta = document.createElement("div");
  meta.className = "kiste-meta";
  const unten = [];
  if (zeigen.length || k.notiz) unten.push(k.raum || "Ohne Raum");
  if (zeigen.length && k.notiz) unten.push(k.notiz);
  unten.forEach(function (t, i) {
    if (i) meta.append(" · ");
    meta.append(markiere(t, q));
  });

  text.append(titel, meta);
  haupt.append(nr, text);

  const haken = document.createElement("button");
  haken.type = "button";
  haken.className = "haken";
  haken.dataset.haken = String(k.nr);
  haken.setAttribute("aria-pressed", String(fertig));
  haken.setAttribute("aria-label", "Kiste " + k.nr + (fertig ? " wieder als offen" : " als ausgepackt") + " markieren");
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("aria-hidden", "true");
  const pfad = document.createElementNS("http://www.w3.org/2000/svg", "path");
  pfad.setAttribute("d", "M5 13l4 4 10-10");
  svg.append(pfad);
  haken.append(svg);

  el.append(haupt, haken);
  return el;
}

/** Füllt das Kisten-Blatt; öffnen macht kisteOeffnen. */
function kisteZeichnen(nr) {
  const k = kisten && kisten.kisten.find(function (x) { return x.nr === nr; });
  if (!k) return false;

  $("kiste-nr").textContent = String(k.nr);
  $("kiste-titel").textContent = k.raum || "Ohne Raum";

  const meta = [];
  if (k.notiz) meta.push(k.notiz);
  meta.push(istFertig(k) ? "ausgepackt" : "noch zu");
  $("kiste-meta").textContent = meta.join(" · ");

  const liste = $("kiste-sachen");
  liste.replaceChildren();
  for (const sa of sachenDerKiste(nr)) {
    const li = document.createElement("li");
    li.append(sa.sache);
    if (sa.zerbrechlich) {
      const z = document.createElement("span");
      z.className = "zerbrechlich";
      z.textContent = "zerbrechlich";
      li.append(z);
    }
    // Kategorie nur zeigen, wenn sie mehr sagt als der Raum darüber.
    if (sa.kategorie && sa.kategorie !== (k.raum || "")) {
      const kat = document.createElement("div");
      kat.className = "kat";
      kat.textContent = sa.kategorie;
      li.append(kat);
    }
    liste.append(li);
  }

  const txt = $("kiste-text");
  txt.textContent = k.text || "";
  txt.classList.toggle("versteckt", !k.text);

  $("btn-kiste-status").textContent = istFertig(k)
    ? "Wieder als offen markieren"
    : "Als ausgepackt markieren";
  return true;
}

function kisteOeffnen(nr) {
  if (!kisteZeichnen(nr)) return;
  offeneKiste = nr;
  overlayAuf("kiste");
}

/**
 * Auf- und Zubuchen. Die Anzeige springt sofort um und wird nur zurückgedreht,
 * wenn das Sheet die Änderung ablehnt — sonst wäre das Abhaken beim Auspacken
 * bei jedem Antippen ein bis drei Sekunden zäh.
 */
async function kisteUmschalten(nr) {
  const k = kisten && kisten.kisten.find(function (x) { return x.nr === nr; });
  if (!k) return;

  const vorher = k.status;
  const neu = istFertig(k) ? "" : "ausgepackt";
  const zurueck = function () {
    k.status = vorher;
    zeichneKisten();
    if (offeneKiste === nr) kisteZeichnen(nr);
  };

  k.status = neu;
  zeichneKisten();
  if (offeneKiste === nr) kisteZeichnen(nr);

  try {
    const antwort = await ruf({
      action: "kiste",
      code: lies(SPEICHER.code, ""),
      nr: nr,
      status: neu
    });
    if (antwort && antwort.ok) {
      uebernimmKisten(antwort);
      if (offeneKiste === nr) kisteZeichnen(nr);
    } else if (antwort && antwort.error === "code") {
      zurueck();
      codeAbgelehnt();
    } else {
      zurueck();
      toast("Nicht gespeichert — bitte erneut versuchen.");
    }
  } catch (e) {
    zurueck();
    toast("Nicht gespeichert — bitte erneut versuchen.");
  }
}

/** Reiter umschalten. laden=false beim Start, dort lädt aktualisiere(). */
function setzeBereich(neu, laden) {
  bereich = neu === "kisten" ? "kisten" : "spar";
  schreibe(SPEICHER.bereich, bereich);

  const istK = bereich === "kisten";
  for (const b of $("reiter").querySelectorAll("button")) {
    b.setAttribute("aria-selected", String(b.dataset.bereich === bereich));
  }
  $("kopf-spar").classList.toggle("versteckt", istK);
  $("kopf-kisten").classList.toggle("versteckt", !istK);
  $("liste").classList.toggle("versteckt", istK);
  $("kisten-liste").classList.toggle("versteckt", !istK);
  $("aktionen").classList.toggle("versteckt", istK);
  $("liste-bereich").scrollTop = 0;
  standHinweis(false);

  if (laden !== false && istK && !kisten && lies(SPEICHER.code, "")) ladeKisten(false);
}

/** Aktualisiert, was gerade sichtbar ist. */
function aktualisiere(still) {
  return bereich === "kisten" ? ladeKisten(still) : ladeStand(still);
}

/* --- Overlays ------------------------------------------------------------- */
function overlayAuf(id) {
  $(id).classList.add("offen");
}

function overlayZu(id) {
  $(id).classList.remove("offen");
  const aktiv = document.activeElement;
  if (aktiv && aktiv.blur) aktiv.blur();
}

function blattFehler(text) {
  const el = $("buchen-fehler");
  el.textContent = text;
  el.classList.toggle("versteckt", !text);
}

function buchenOeffnen(neuerModus) {
  modus = neuerModus;
  laufendeId = uuid();
  const rein = modus === "ein";
  $("buchen-titel").textContent = rein ? "Einzahlen" : "Entnehmen";
  $("btn-buchen").textContent = rein ? "Einzahlen" : "Entnehmen";
  $("btn-buchen").classList.toggle("raus", !rein);
  $("betrag").value = "";
  $("kommentar").value = "";
  $("betrag-vorschau").textContent = "";
  blattFehler("");
  overlayAuf("buchen");
  setTimeout(() => $("betrag").focus(), 180);
}

function einrichtenOeffnen(fehlertext) {
  const el = $("einrichten-fehler");
  el.textContent = fehlertext || "";
  el.classList.toggle("versteckt", !fehlertext);
  $("code").value = "";
  werZeichnen(lies(SPEICHER.wer, ""));
  overlayAuf("einrichten");
  setTimeout(() => $("code").focus(), 200);
}

function werZeichnen(wer) {
  for (const b of $("wer-wahl").querySelectorAll("button")) {
    b.setAttribute("aria-pressed", String(b.dataset.wer === wer));
  }
}

function toast(text) {
  const el = $("toast");
  el.textContent = text;
  el.classList.add("an");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.classList.remove("an"), 2600);
}

/* --- Ereignisse ----------------------------------------------------------- */
$("btn-ein").addEventListener("click", () => buchenOeffnen("ein"));
$("btn-aus").addEventListener("click", () => buchenOeffnen("aus"));
$("btn-buchen").addEventListener("click", buche);
$("btn-neu").addEventListener("click", () => aktualisiere(false));

$("reiter").addEventListener("click", (e) => {
  const knopf = e.target.closest("button[data-bereich]");
  if (knopf) setzeBereich(knopf.dataset.bereich, true);
});

$("kfilter").addEventListener("click", (e) => {
  const knopf = e.target.closest("button[data-filter]");
  if (!knopf) return;
  kFilter = knopf.dataset.filter;
  for (const b of $("kfilter").querySelectorAll("button")) {
    b.setAttribute("aria-pressed", String(b.dataset.filter === kFilter));
  }
  zeichneKisten();
});

// „search“ fängt zusätzlich das kleine X im Suchfeld ab.
for (const ereignis of ["input", "search"]) {
  $("suche").addEventListener(ereignis, () => {
    suchtext = $("suche").value;
    zeichneKisten();
  });
}

$("kisten-liste").addEventListener("click", (e) => {
  const haken = e.target.closest("button[data-haken]");
  if (haken) { kisteUmschalten(Number(haken.dataset.haken)); return; }
  const zeile = e.target.closest("button[data-nr]");
  if (zeile) kisteOeffnen(Number(zeile.dataset.nr));
});

$("btn-kiste-status").addEventListener("click", () => {
  if (offeneKiste !== null) kisteUmschalten(offeneKiste);
});

$("betrag").addEventListener("input", () => {
  const wert = betragLesen($("betrag").value);
  $("betrag-vorschau").textContent = isFinite(wert) && wert > 0
    ? (modus === "ein" ? "+ " : "− ") + euro(wert)
    : "";
});

for (const el of document.querySelectorAll("[data-schliessen]")) {
  el.addEventListener("click", () => overlayZu(el.closest(".overlay").id));
}

for (const id of ["buchen", "menu", "kiste"]) {
  $(id).addEventListener("click", (e) => { if (e.target.id === id) overlayZu(id); });
}

document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  for (const id of ["buchen", "menu", "kiste"]) overlayZu(id);
});

for (const feld of [$("betrag"), $("kommentar")]) {
  feld.addEventListener("keydown", (e) => { if (e.key === "Enter") buche(); });
}

$("wer-wahl").addEventListener("click", (e) => {
  const knopf = e.target.closest("button[data-wer]");
  if (knopf) werZeichnen(knopf.dataset.wer);
});

$("btn-einrichten").addEventListener("click", async () => {
  const code = $("code").value.trim();
  const gewaehlt = $("wer-wahl").querySelector('button[aria-pressed="true"]');
  const fehler = $("einrichten-fehler");
  if (!code) {
    fehler.textContent = "Bitte den Familien-Code eingeben.";
    fehler.classList.remove("versteckt");
    return;
  }
  if (!gewaehlt) {
    fehler.textContent = "Bitte Indir oder Luca wählen.";
    fehler.classList.remove("versteckt");
    return;
  }
  schreibe(SPEICHER.code, code);
  schreibe(SPEICHER.wer, gewaehlt.dataset.wer);
  overlayZu("einrichten");
  await ladeStand(false);
});

$("code").addEventListener("keydown", (e) => { if (e.key === "Enter") $("btn-einrichten").click(); });

$("btn-menu").addEventListener("click", () => {
  $("menu-info").textContent = "Angemeldet als " + (lies(SPEICHER.wer, "—") || "—") +
    (MOCK ? " · Vorschau-Modus" : "");
  overlayAuf("menu");
});

$("btn-wer-wechseln").addEventListener("click", () => {
  const jetzt = lies(SPEICHER.wer, "");
  schreibe(SPEICHER.wer, jetzt === "Indir" ? "Luca" : "Indir");
  overlayZu("menu");
  toast("Jetzt als " + lies(SPEICHER.wer, "") + " unterwegs");
});

$("btn-code-neu").addEventListener("click", () => {
  overlayZu("menu");
  einrichtenOeffnen("");
});

/* Ziehen zum Aktualisieren ------------------------------------------------- */
(function ziehenZumLaden() {
  const bereich = $("liste-bereich");
  const anzeige = $("zieher");
  let startY = 0;
  let aktiv = false;
  let weg = 0;

  bereich.addEventListener("touchstart", (e) => {
    aktiv = bereich.scrollTop <= 0 && e.touches.length === 1 && !laeuft;
    startY = e.touches[0].clientY;
    weg = 0;
  }, { passive: true });

  bereich.addEventListener("touchmove", (e) => {
    if (!aktiv) return;
    const dy = e.touches[0].clientY - startY;
    if (dy <= 0) { aktiv = false; anzeige.style.height = "0px"; return; }
    e.preventDefault();
    weg = Math.min(dy * 0.5, 84);
    anzeige.style.height = weg + "px";
    anzeige.textContent = weg >= 56 ? "Loslassen zum Aktualisieren" : "Zum Aktualisieren ziehen";
  }, { passive: false });

  bereich.addEventListener("touchend", () => {
    if (!aktiv) return;
    aktiv = false;
    anzeige.style.height = "0px";
    if (weg >= 56) aktualisiere(false);
  }, { passive: true });
})();

/* Blatt über der iOS-Tastatur halten --------------------------------------- */
if (window.visualViewport) {
  const anpassen = () => {
    const vv = window.visualViewport;
    const platz = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    for (const el of document.querySelectorAll(".overlay")) {
      el.style.paddingBottom = platz + "px";
    }
  };
  window.visualViewport.addEventListener("resize", anpassen);
  window.visualViewport.addEventListener("scroll", anpassen);
}

/* --- Start ---------------------------------------------------------------- */
(function start() {
  if (MOCK) {
    const h = $("hinweis");
    h.textContent = "Vorschau mit Beispieldaten — noch nicht mit dem Sheet verbunden.";
    h.classList.remove("versteckt");
  }

  const zwischenspeicher = lies(SPEICHER.stand, null);
  if (zwischenspeicher && zwischenspeicher.zustand) {
    zustand = zwischenspeicher.zustand;
    standGeladenAm = zwischenspeicher.geladenAm;
    zeichne();
  }

  const kistenSpeicher = lies(SPEICHER.kisten, null);
  if (kistenSpeicher && kistenSpeicher.kisten) {
    kisten = kistenSpeicher.kisten;
    kistenGeladenAm = kistenSpeicher.geladenAm;
    zeichneKisten();
  }

  setzeBereich(lies(SPEICHER.bereich, "spar"), false);

  if (!lies(SPEICHER.code, "")) {
    einrichtenOeffnen("");
  } else {
    aktualisiere(false);
  }

  // Beim Zurückkehren zur App frisch laden.
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && lies(SPEICHER.code, "")) aktualisiere(true);
  });

  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    navigator.serviceWorker.register("sw.js").catch(() => { /* ohne SW läuft die App auch */ });
  }
})();
</script>
