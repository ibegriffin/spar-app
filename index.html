<body>
<header class="kopf">
<div class="kopf-zeile">
<span class="marke"><img src="icon-32.png" alt="" width="22" height="22">Sparglas</span>
<span class="kopf-knoepfe">
<button class="rund" id="btn-neu" aria-label="Aktualisieren">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4"/></svg>
</button>
<button class="rund" id="btn-menu" aria-label="Einstellungen">
<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg>
</button>
</span>
</div>
<div class="reiter" id="reiter" role="tablist" aria-label="Bereich">
<button type="button" role="tab" data-bereich="gewuerze" aria-selected="true">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10h18l-1.6 9a2 2 0 0 1-2 1.5H6.6a2 2 0 0 1-2-1.5z"/><path d="M8.5 10l3-6M15.5 10l-3-6M9.5 14v3M14.5 14v3"/></svg>Vorrat
</button>
<button type="button" role="tab" data-bereich="kisten" aria-selected="false">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l9-4 9 4v9l-9 4-9-4z"/><path d="M3 8l9 4 9-4M12 12v9"/></svg>Kisten
</button>
<button type="button" role="tab" data-bereich="spar" aria-selected="false">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8M7 7h10M7 7c-1.5 1.5-2 3-2 5v6a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3v-6c0-2-.5-3.5-2-5"/><path d="M9.5 14.5h5M12 12v5"/></svg>Sparglas
</button>
</div>
<div id="kopf-spar">
<div class="saldo zahl" id="saldo" aria-live="polite">—</div>
</div>
<div id="kopf-kisten" class="versteckt">
<div class="kzahl-zeile">
<div class="kzahl zahl" id="kisten-zahl" aria-live="polite">—</div>
<button type="button" class="waehlen" id="btn-waehlen" aria-pressed="false">Auswählen</button>
</div>
<div class="balken"><i id="kisten-balken"></i></div>
<div class="suchfeld">
<input id="suche" class="suche" type="search" enterkeyhint="search" autocomplete="off"
autocapitalize="none" spellcheck="false" placeholder="Wonach suchst du?"
aria-label="Kisten durchsuchen">
<button type="button" class="suche-x versteckt" id="btn-suche-leeren" aria-label="Suche löschen">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
</button>
</div>
<div class="kfilter" id="kfilter">
<button type="button" data-filter="alle" aria-pressed="true">Alle</button>
<button type="button" data-filter="offen" aria-pressed="false">Offen</button>
<button type="button" data-filter="fertig" aria-pressed="false">Ausgepackt</button>
<span class="trenner" aria-hidden="true"></span>
<button type="button" data-ort="lager" aria-pressed="false">Lager</button>
<button type="button" data-ort="wohnung" aria-pressed="false">Wohnung</button>
</div>
</div>
<div id="kopf-gewuerze" class="versteckt">
<div class="kzahl-zeile">
<div class="kzahl zahl" id="gewuerze-zahl" aria-live="polite">—</div>
</div>
<div class="suchfeld">
<input id="gsuche" class="suche" type="search" enterkeyhint="search" autocomplete="off"
autocapitalize="none" spellcheck="false" placeholder="Name, Marke oder Zutat"
aria-label="Vorrat durchsuchen">
<button type="button" class="suche-x versteckt" id="btn-gsuche-leeren" aria-label="Suche löschen">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
</button>
</div>
<div class="kfilter" id="gfilter">
<button type="button" data-gfilter="einkaufen" aria-pressed="false">Einkaufen</button>
