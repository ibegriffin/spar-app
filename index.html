<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sparglas</title>
<meta name="description" content="Gemeinsame Spar-Kasse für zwei.">
<meta name="theme-color" content="#1e7a60" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d4a3c" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sparglas">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex">

<style>
/* ---------------------------------------------------------------------------
   Sparglas — eine Datei, kein Framework, kein Build-Schritt.
   Aufbau: 1) Farben & Grundlagen  2) Kopf  3) Liste  4) Aktionen  5) Kisten  5b) Gewürze
           6) Overlays (Buchen, Einrichten, Einstellungen, Kiste)  7) Hinweise
   --------------------------------------------------------------------------- */

/* 1) Farben & Grundlagen --------------------------------------------------- */
:root {
  --gruen-1: #1e7a60;
  --gruen-2: #0d4a3c;
  /* Akzent des sichtbaren Bereichs: Kopf, Knöpfe, Markierungen. Vorgabe = Sparglas-Grün,
     body[data-bereich] schaltet auf Kisten-Blau bzw. Gewürze-Bernstein um. */
  --akzent-1: var(--gruen-1);
  --akzent-2: var(--gruen-2);
  --akzent-knopf: var(--gruen-1);
  --akzent-text: var(--ein);
  --ein: #0f6b46;
  --aus: #b0432c;
  --gold: #e9a83a;
  --pille: #ffffff;
  --pille-text: #14211c;

  --bg: #f1f4f2;
  --karte: #ffffff;
  --text: #14211c;
  --leise: #66786f;
  --linie: #e2e8e4;
  --schatten: 0 1px 2px rgba(16, 34, 27, .06), 0 8px 24px rgba(16, 34, 27, .06);

  --radius: 16px;
  --oben: env(safe-area-inset-top);
  --unten: env(safe-area-inset-bottom);
  --seite: max(16px, env(safe-area-inset-left));
}

body[data-bereich="kisten"] {
  --akzent-1: #2e5c9a;
  --akzent-2: #16345e;
  --akzent-knopf: #2e5c9a;
  --akzent-text: #2b5691;
}

body[data-bereich="gewuerze"] {
  --akzent-1: #6a45a6;
  --akzent-2: #3a2364;
  --akzent-knopf: #6a45a6;
  --akzent-text: #5c3b95;
}

@media (prefers-color-scheme: dark) {
  :root { --akzent-knopf: #1b6b54; --akzent-text: #4cc38a; }
  body[data-bereich="kisten"] { --akzent-knopf: #27507f; --akzent-text: #82b4f2; }
  body[data-bereich="gewuerze"] { --akzent-knopf: #563a8a; --akzent-text: #b79bee; }
}

@media (prefers-color-scheme: dark) {
  :root {
    --ein: #4cc38a;
    --aus: #f08a6c;
    --bg: #0e1512;
    --karte: #17211d;
    --text: #e7efeb;
    --leise: #93a49d;
    --linie: #25332d;
    --pille: #d7e7e0;
    --pille-text: #0f1d18;
    --schatten: 0 1px 2px rgba(0, 0, 0, .4);
  }
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  overscroll-behavior-y: none;
}

body {
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

@supports (height: 100dvh) {
  body { height: 100dvh; }
}

button, input, select {
  font: inherit;
  color: inherit;
}

button {
  border: 0;
  background: none;
  cursor: pointer;
}

:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
  border-radius: 6px;
}

.zahl { font-variant-numeric: tabular-nums; }
.versteckt { display: none !important; }

/* 2) Kopf ------------------------------------------------------------------ */
.kopf {
  flex: none;
  position: relative;
  padding: calc(var(--oben) + 14px) var(--seite) 20px;
  background: linear-gradient(160deg, var(--akzent-1), var(--akzent-2));
  color: #fff;
  z-index: 2;
}

.kopf-zeile {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 32px;
}

.marke {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: .01em;
  opacity: .92;
}

.marke img { width: 22px; height: 22px; border-radius: 6px; }

.kopf-knoepfe { display: flex; gap: 2px; }

.rund {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: #fff;
  opacity: .9;
}

.rund:active { background: rgba(255, 255, 255, .16); }
.rund svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

.saldo {
  margin: 10px 0 0;
  font-size: clamp(38px, 12vw, 52px);
  font-weight: 700;
  letter-spacing: -.02em;
  line-height: 1.05;
}

.stand {
  margin-top: 6px;
  font-size: 13px;
  opacity: .78;
  min-height: 19px;
}

/* Ladebalken am unteren Rand des Kopfes */
.laden {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 2px;
  overflow: hidden;
  opacity: 0;
  transition: opacity .2s;
}

.laden.an { opacity: 1; }

.laden::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(255, 255, 255, .85);
  transform: translateX(-100%);
  animation: schieben 1.1s ease-in-out infinite;
}

@keyframes schieben {
  0%   { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

/* 3) Liste ----------------------------------------------------------------- */
main {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 0 var(--seite) 12px;
}

.zieher {
  height: 0;
  display: grid;
  place-items: center;
  overflow: hidden;
  font-size: 13px;
  color: var(--leise);
  transition: height .18s ease;
}

.monat {
  position: sticky;
  top: 0;
  z-index: 1;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 4px 8px;
  background: linear-gradient(var(--bg) 70%, transparent);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--leise);
}

.monat-summe { text-transform: none; letter-spacing: 0; font-weight: 600; }

.gruppe {
  background: var(--karte);
  border-radius: var(--radius);
  box-shadow: var(--schatten);
  overflow: hidden;
}

.buchung {
  display: flex;
  align-items: baseline;
  gap: 12px;
  padding: 13px 16px;
  border-top: 1px solid var(--linie);
}

.gruppe .buchung:first-child { border-top: 0; }

.buchung-text { flex: 1; min-width: 0; }

.buchung-titel {
  overflow-wrap: anywhere;
  font-size: 15px;
}

.buchung-titel.ohne { color: var(--leise); }

.buchung-meta {
  margin-top: 2px;
  font-size: 12.5px;
  color: var(--leise);
}

.buchung-betrag {
  flex: none;
  font-size: 16px;
  font-weight: 650;
  white-space: nowrap;
}

.plus { color: var(--ein); }
.minus { color: var(--aus); }

.leer {
  margin-top: 22px;
  padding: 28px 20px;
  border: 1px dashed var(--linie);
  border-radius: var(--radius);
  text-align: center;
  color: var(--leise);
  font-size: 14.5px;
}

/* 4) Aktionen -------------------------------------------------------------- */
.aktionen {
  flex: none;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 10px var(--seite) calc(var(--unten) + 10px);
  background: var(--karte);
  border-top: 1px solid var(--linie);
}

.aktionen.eins { grid-template-columns: 1fr; }

.tat {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 54px;
  border-radius: 14px;
  font-size: 16.5px;
  font-weight: 600;
  color: #fff;
  background: var(--akzent-knopf);
  transition: transform .12s ease, filter .12s ease;
}

.tat.raus { background: #8a3a26; }
.tat:active { transform: scale(.98); filter: brightness(1.08); }
.tat svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }

@media (prefers-color-scheme: dark) {
  .tat.raus { background: #7c3421; }
}

/* 5) Kisten ---------------------------------------------------------------- */
/* Umschalter zwischen Sparglas und Kisten, sitzt im gruenen Kopf. */
.reiter {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 3px;
  margin-top: 14px;
  padding: 3px;
  border-radius: 11px;
  background: rgba(255, 255, 255, .16);
}

.reiter button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 7px 4px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  color: #fff;
  opacity: .8;
  transition: background .16s ease, opacity .16s ease;
}

.reiter svg {
  flex: none;
  width: 14px;
  height: 14px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* Die gewaehlte Pille muss im gruenen Kopf heller sein als der Grund — im
   Dunkelmodus ist die Kartenfarbe dafuer zu dunkel, deshalb ein eigenes Paar. */
.reiter button[aria-selected="true"] {
  background: var(--pille);
  color: var(--pille-text);
  opacity: 1;
}

.kzahl {
  font-size: clamp(26px, 8vw, 34px);
  font-weight: 700;
  letter-spacing: -.02em;
  line-height: 1.1;
}

.kzahl small { font-size: 15px; font-weight: 600; opacity: .82; }

.balken {
  margin-top: 9px;
  height: 5px;
  border-radius: 3px;
  background: rgba(255, 255, 255, .22);
  overflow: hidden;
}

.balken i {
  display: block;
  height: 100%;
  width: 0;
  border-radius: 3px;
  background: var(--gold);
  transition: width .3s ease;
}

/* 16px verhindert, dass iOS beim Antippen in das Feld hineinzoomt. */
.suchfeld { position: relative; margin-top: 12px; }

.suche {
  width: 100%;
  padding: 11px 44px 11px 14px;
  border: 0;
  border-radius: 12px;
  background: var(--karte);
  color: var(--text);
  font-size: 16px;
  -webkit-appearance: none;
}

.suche::placeholder { color: var(--leise); }

/* Safari blendet hier ein eigenes Kreuz ein — wir nehmen unser eigenes,
   weil das native auf dem iPhone gar nicht erst erscheint. */
.suche::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }

.suche-x {
  position: absolute;
  top: 50%;
  right: 6px;
  transform: translateY(-50%);
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: var(--leise);
}

.suche-x:active { background: var(--bg); }

.suche-x svg {
  width: 17px; height: 17px;
  fill: none; stroke: currentColor;
  stroke-width: 2.2; stroke-linecap: round;
}

/* Zähler links, Auswählen rechts — so bleibt die Filterzeile darunter frei. */
.kzahl-zeile {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 14px;
}

/* Die Filter-Chips scrollen waagerecht, wenn sie nicht in eine Zeile passen. */
.kfilter {
  display: flex;
  gap: 7px;
  margin-top: 10px;
  overflow-x: auto;
  scrollbar-width: none;
}

.kfilter::-webkit-scrollbar { display: none; }

.kfilter button, .waehlen {
  flex: none;
  padding: 5px 12px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  color: #fff;
  background: rgba(255, 255, 255, .16);
  opacity: .84;
}

.kfilter .trenner {
  flex: none;
  width: 1px;
  margin: 4px 1px;
  background: rgba(255, 255, 255, .3);
}

.waehlen[aria-pressed="true"] {
  background: var(--pille);
  color: var(--pille-text);
  opacity: 1;
}

.kfilter button[aria-pressed="true"] {
  background: var(--pille);
  color: var(--pille-text);
  opacity: 1;
}

/* Eine Zeile = zwei Knoepfe nebeneinander: oeffnen und abhaken. Verschachtelte
   Buttons sind in HTML nicht erlaubt, deshalb der Rahmen als div. */
.kiste {
  display: flex;
  align-items: center;
  border-top: 1px solid var(--linie);
}

.gruppe .kiste:first-child { border-top: 0; }

.kiste-haupt {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 4px 11px 14px;
  text-align: left;
}

.kiste-haupt:active { background: color-mix(in srgb, var(--akzent-1) 7%, transparent); }

.kiste-nr {
  flex: none;
  min-width: 42px;
  height: 34px;
  padding: 0 7px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  background: var(--bg);
  color: var(--akzent-text);
  font-size: 16px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.kiste.fertig .kiste-nr { background: var(--linie); color: var(--leise); }

/* Im Auswahl-Modus bedeutet der Kreis „ausgewählt“, nicht „ausgepackt“ —
   sonst sähen bereits ausgepackte Kisten wie angehakte aus. */
.kiste.gewaehlt { background: color-mix(in srgb, var(--akzent-1) 9%, transparent); }

#kisten-liste.waehlt .kiste.fertig .haken {
  border-color: var(--linie);
  background: none;
  color: transparent;
}

#kisten-liste.waehlt .kiste.gewaehlt .haken {
  border-color: var(--akzent-1);
  background: var(--akzent-1);
  color: #fff;
}

.kiste-text { flex: 1; min-width: 0; }

.kiste-titel { font-size: 15px; overflow-wrap: anywhere; }
.kiste.fertig .kiste-titel { color: var(--leise); }

.kiste-meta {
  margin-top: 2px;
  font-size: 12.5px;
  color: var(--leise);
  overflow-wrap: anywhere;
}

/* Der Ort soll beim Überfliegen der Liste sofort ins Auge fallen. */
.kiste-meta .ort { font-weight: 700; color: var(--text); }
.kiste.fertig .kiste-meta .ort { color: var(--leise); }

.kiste-meta mark {
  background: rgba(233, 168, 58, .32);
  color: inherit;
  border-radius: 3px;
  padding: 0 1px;
}

.haken {
  flex: none;
  width: 30px;
  height: 30px;
  margin: 0 12px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 1.8px solid var(--linie);
  color: transparent;
  transition: background .14s ease, border-color .14s ease;
}

.kiste.fertig .haken {
  border-color: var(--ein);
  background: var(--ein);
  color: #fff;
}

.haken svg {
  width: 16px; height: 16px;
  fill: none; stroke: currentColor;
  stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round;
}

.zerbrechlich {
  display: inline-block;
  margin-left: 6px;
  padding: 0 6px;
  border-radius: 999px;
  background: rgba(176, 67, 44, .13);
  color: var(--aus);
  font-size: 11.5px;
  font-weight: 600;
}

/* Leiste am unteren Rand, solange etwas ausgewählt ist */
.aleiste {
  flex: none;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px var(--seite) calc(var(--unten) + 10px);
  background: var(--karte);
  border-top: 1px solid var(--linie);
}

.aleiste .anzahl { flex: 1; min-width: 0; font-size: 14.5px; font-weight: 600; }

.aleiste button {
  flex: none;
  min-height: 44px;
  padding: 0 16px;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
}

.aleiste .neben { background: var(--bg); color: var(--text); }
.aleiste .haupt { background: var(--akzent-knopf); color: #fff; }
.aleiste .haupt:disabled { opacity: .4; }

/* Kisten-Blatt */
.k-kopf { display: flex; align-items: center; gap: 12px; }

.ortwahl {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  margin-top: 14px;
  padding: 4px;
  border-radius: 12px;
  background: var(--karte);
}

.ortwahl button {
  padding: 9px 4px;
  border-radius: 9px;
  font-size: 14.5px;
  font-weight: 600;
  color: var(--leise);
}

.ortwahl button[aria-pressed="true"] {
  background: var(--akzent-knopf);
  color: #fff;
}

.option {
  display: block;
  width: 100%;
  margin-top: 8px;
  padding: 13px 16px;
  border-radius: 12px;
  background: var(--karte);
  color: var(--text);
  font-size: 15.5px;
  font-weight: 600;
  text-align: left;
}

.option:active { filter: brightness(.97); }

.loeschen {
  display: block;
  width: 100%;
  margin-top: 10px;
  padding: 12px;
  border-radius: 12px;
  color: var(--aus);
  font-size: 15px;
  font-weight: 600;
  transition: background .14s ease, color .14s ease;
}

.loeschen.scharf { background: var(--aus); color: #fff; }
.loeschen:disabled { opacity: .5; }
.k-kopf h2 { margin: 0; }
.k-sachen { margin: 14px 0 0; padding: 0; list-style: none; }

.k-sachen li {
  padding: 9px 0;
  border-top: 1px solid var(--linie);
  font-size: 15px;
}

.k-sachen li:first-child { border-top: 0; }
.k-sachen .kat { margin-top: 1px; color: var(--leise); font-size: 12.5px; }

.k-text {
  margin-top: 14px;
  padding: 12px 14px;
  border-radius: 12px;
  background: var(--karte);
  color: var(--leise);
  font-size: 13.5px;
}

/* 5b) Gewürze & Co. -------------------------------------------------------- */
/* Die Zeilen nutzen das Kisten-Muster; „leer“ = aufgebraucht, sieht aus wie
   eine ausgepackte Kiste, damit die Liste denselben Rhythmus behält. */
.kiste.aufgebraucht .kiste-nr { background: var(--linie); color: var(--leise); }
.kiste-nr svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.kiste.aufgebraucht .kiste-titel { color: var(--leise); }

/* Plus am Zeilenende auf der Besorgen-Liste: holt die Position in den Vorrat.
   Eigene Klasse: „.plus“ gehört den positiven Beträgen im Sparglas. */
.besorgen-plus {
  flex: none;
  width: 34px;
  height: 34px;
  margin: 0 10px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--akzent-knopf);
  color: #fff;
}

/* SVG statt Text-„+“: ein Schriftzeichen sitzt nie exakt mittig im Kreis. */
.besorgen-plus svg {
  width: 18px;
  height: 18px;
  display: block;
  fill: none;
  stroke: currentColor;
  stroke-width: 2.4;
  stroke-linecap: round;
}

.besorgen-plus:active { filter: brightness(1.1); }

.wahl.drei { grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.wahl.drei button { padding: 12px 4px; font-size: 15px; }

.kiste-meta .zut {
  display: block;
  margin-top: 1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Anzahl-Stepper im Blatt: minus, Zahl, plus */
.stepper {
  display: grid;
  grid-template-columns: 54px 1fr 54px;
  align-items: center;
  margin-top: 14px;
  padding: 6px;
  border-radius: 14px;
  background: var(--karte);
}

.stepper button {
  height: 46px;
  border-radius: 10px;
  color: var(--text);
  font-size: 26px;
  font-weight: 500;
  line-height: 1;
}

.stepper button:active { background: var(--bg); }
.stepper button:disabled { opacity: .3; }

.stepper .wert {
  text-align: center;
  font-size: 22px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.stepper .wert small {
  display: block;
  margin-top: 2px;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--leise);
}

.zutaten {
  margin-top: 14px;
  padding: 12px 14px;
  border-radius: 12px;
  background: var(--karte);
  font-size: 14.5px;
  line-height: 1.45;
}

.zutaten b { display: block; margin-bottom: 4px; font-size: 12.5px; color: var(--leise); }

.zutaten mark {
  background: rgba(233, 168, 58, .32);
  color: inherit;
  border-radius: 3px;
  padding: 0 1px;
}

.quelle {
  display: block;
  margin-top: 10px;
  padding: 12px 14px;
  border-radius: 12px;
  background: var(--karte);
  color: var(--ein);
  font-size: 14.5px;
  font-weight: 600;
  text-decoration: none;
  overflow-wrap: anywhere;
}

/* 6) Overlays -------------------------------------------------------------- */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  background: rgba(8, 20, 16, .5);
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease;
}

.overlay.offen { opacity: 1; pointer-events: auto; }

.blatt {
  background: var(--bg);
  border-radius: 22px 22px 0 0;
  padding: 8px var(--seite) calc(var(--unten) + 16px);
  transform: translateY(16px);
  transition: transform .22s ease;
  max-height: 92%;
  overflow-y: auto;
}

.overlay.offen .blatt { transform: translateY(0); }

.griff {
  width: 40px;
  height: 4px;
  margin: 6px auto 12px;
  border-radius: 2px;
  background: var(--linie);
}

.blatt h2 {
  margin: 0 0 14px;
  font-size: 19px;
  font-weight: 650;
}

.feld { margin-bottom: 14px; }

.feld label {
  display: block;
  margin-bottom: 6px;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--leise);
}

.feld input {
  width: 100%;
  padding: 13px 14px;
  border: 1px solid var(--linie);
  border-radius: 12px;
  background: var(--karte);
  font-size: 17px;
  -webkit-appearance: none;
  appearance: none;
}

.feld input:focus { border-color: var(--akzent-1); outline: none; }

#betrag {
  font-size: 30px;
  font-weight: 650;
  letter-spacing: -.01em;
  text-align: center;
}

.vorschau {
  margin-top: 8px;
  text-align: center;
  font-size: 14px;
  color: var(--leise);
  min-height: 20px;
}

.wahl { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.wahl button {
  padding: 13px;
  border: 1.5px solid var(--linie);
  border-radius: 12px;
  background: var(--karte);
  font-size: 16px;
  font-weight: 600;
}

.wahl button[aria-pressed="true"] {
  border-color: var(--akzent-1);
  background: color-mix(in srgb, var(--akzent-1) 12%, var(--karte));
  color: var(--akzent-text);
}

.absenden {
  width: 100%;
  min-height: 52px;
  margin-top: 4px;
  border-radius: 13px;
  background: var(--akzent-knopf);
  color: #fff;
  font-size: 16.5px;
  font-weight: 650;
}

.absenden.raus { background: #8a3a26; }
.absenden:disabled { opacity: .55; }

.abbrechen {
  width: 100%;
  padding: 14px;
  margin-top: 2px;
  color: var(--leise);
  font-size: 15.5px;
}

.fehler {
  margin: 0 0 12px;
  padding: 11px 13px;
  border-radius: 11px;
  background: color-mix(in srgb, var(--aus) 14%, var(--karte));
  color: var(--aus);
  font-size: 14.5px;
}

.hilfe {
  margin: -4px 0 16px;
  color: var(--leise);
  font-size: 14px;
}

/* Einrichtung füllt den Bildschirm statt am unteren Rand zu kleben */
#einrichten { justify-content: center; background: var(--bg); }
#einrichten .blatt { border-radius: 0; background: none; padding-top: calc(var(--oben) + 24px); }
#einrichten .glas { display: block; width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 16px; }
#einrichten h2 { text-align: center; }

/* 7) Hinweise -------------------------------------------------------------- */
.hinweis {
  flex: none;
  padding: 9px var(--seite);
  background: color-mix(in srgb, var(--gold) 22%, var(--bg));
  color: var(--text);
  font-size: 13px;
  text-align: center;
  border-bottom: 1px solid var(--linie);
}

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--unten) + 88px);
  z-index: 20;
  padding: 11px 18px;
  border-radius: 999px;
  background: rgba(20, 33, 28, .94);
  color: #fff;
  font-size: 14.5px;
  font-weight: 550;
  white-space: nowrap;
  transform: translate(-50%, 12px);
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
}

.toast.an { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }

.toast button {
  margin: -6px -8px -6px 14px;
  padding: 6px 10px;
  border-radius: 999px;
  color: var(--gold);
  font-size: 14.5px;
  font-weight: 700;
}

.toast button:active { background: rgba(255, 255, 255, .12); }

@media (prefers-reduced-motion: reduce) {
  *, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}
</style>

<script>
"use strict";

/* ===========================================================================
   EINSTELLUNG — hier trägt die Session nach Phase 2 die Apps-Script-URL ein.
   Solange der Wert leer ist, läuft die App im Vorschau-Modus mit Beispieldaten.
   Die URL endet auf /exec. Der Familien-Code steht NIE in dieser Datei.
   =========================================================================== */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzEQP8iuYzQMRav2ZyK_SUv1Hujf75-g1wygA9qXUPYRCb2BhlUWhBGUeWgoEPZLvTjLA/exec";

const MOCK = SCRIPT_URL === "";
const SPEICHER = {
  code: "sparglas.code",
  wer: "sparglas.wer",
  stand: "sparglas.stand",
  mock: "sparglas.mockdaten",
  kisten: "sparglas.kisten",
  bereich: "sparglas.bereich",
  mockKisten: "sparglas.mockkisten",
  gewuerze: "sparglas.gewuerze",
  mockGewuerze: "sparglas.mockgewuerze",
  gfilter: "sparglas.gfilter"
};

/* --- kleine Helfer -------------------------------------------------------- */
const $ = (id) => document.getElementById(id);

const euroFormat = new Intl.NumberFormat("de-DE", { style: "currency", currency: "EUR" });
const monatFormat = new Intl.DateTimeFormat("de-DE", { month: "long", year: "numeric" });
const datumFormat = new Intl.DateTimeFormat("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" });
const uhrFormat = new Intl.DateTimeFormat("de-DE", { hour: "2-digit", minute: "2-digit" });

function euro(n) {
  return euroFormat.format(n);
}

function euroMitZeichen(n) {
  return (n < 0 ? "−" : "+") + euroFormat.format(Math.abs(n));
}

function lies(schluessel, standard) {
  try {
    const roh = localStorage.getItem(schluessel);
    return roh === null ? standard : JSON.parse(roh);
  } catch (e) {
    return standard;
  }
}

function schreibe(schluessel, wert) {
  try {
    localStorage.setItem(schluessel, JSON.stringify(wert));
  } catch (e) { /* z. B. voller Speicher — nicht kritisch */ }
}

function uuid() {
  if (self.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function (c) {
    const r = Math.random() * 16 | 0;
    return (c === "x" ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

/** „12,50“, „1.234,56“ und „12.5“ ergeben alle eine Zahl; sonst NaN. */
function betragLesen(text) {
  let s = String(text).replace(/[\s €]/g, "");
  if (s === "") return NaN;
  const hatKomma = s.indexOf(",") >= 0;
  const hatPunkt = s.indexOf(".") >= 0;
  if (hatKomma && hatPunkt) {
    s = s.replace(/\./g, "").replace(",", ".");       // 1.234,56
  } else if (hatKomma) {
    s = s.replace(",", ".");                          // 12,50
  } else if (hatPunkt) {
    const teile = s.split(".");
    const letzter = teile[teile.length - 1];
    if (teile.length > 2 || letzter.length === 3) s = teile.join("");  // 1.234 = Tausender
  }
  if (!/^-?\d*\.?\d*$/.test(s)) return NaN;
  const zahl = Number(s);
  return isFinite(zahl) ? Math.round(Math.abs(zahl) * 100) / 100 : NaN;
}

/**
 * Zeitstempel aus dem Sheet in ein Datum verwandeln.
 * Normalfall ist ISO-Text. Apps Script kann aber auch einen englischen
 * Datumstext liefern („Thu Aug 06 2026 11:56:14 GMT+0200 (Mitteleuropäische
 * Sommerzeit)“) — den versteht nicht jeder Browser von sich aus, deshalb die
 * beiden Rückfallebenen.
 */
function alsDatum(ts) {
  const direkt = new Date(ts);
  if (!isNaN(direkt)) return direkt;

  const ohneKlammer = String(ts).replace(/\s*\([^)]*\)\s*$/, "");
  const zweiter = new Date(ohneKlammer);
  if (!isNaN(zweiter)) return zweiter;

  const teile = /([A-Za-z]{3})\s+(\d{1,2})\s+(\d{4})\s+(\d{1,2}):(\d{2}):(\d{2})(?:\s*GMT([+-])(\d{2})(\d{2}))?/.exec(ohneKlammer);
  if (teile) {
    const monate = { Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5, Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11 };
    const monat = monate[teile[1]];
    if (monat !== undefined) {
      const ms = Date.UTC(+teile[3], monat, +teile[2], +teile[4], +teile[5], +teile[6]);
      const versatz = teile[7] ? (teile[7] === "-" ? -1 : 1) * ((+teile[8]) * 60 + (+teile[9])) : 0;
      return new Date(ms - versatz * 60000);
    }
  }
  return direkt;   // ungültig — die Buchung landet dann unter „Ohne Datum“
}

function zeitpunktText(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return "";
  const heute = new Date();
  const gleicherTag = (a, b) => a.toDateString() === b.toDateString();
  const gestern = new Date(heute.getTime() - 86400000);
  if (gleicherTag(d, heute)) return "heute, " + uhrFormat.format(d) + " Uhr";
  if (gleicherTag(d, gestern)) return "gestern, " + uhrFormat.format(d) + " Uhr";
  return datumFormat.format(d) + ", " + uhrFormat.format(d) + " Uhr";
}

/* --- Server-Zugriff ------------------------------------------------------- */
async function ruf(nutzlast) {
  if (MOCK) return mockRuf(nutzlast);

  const abbruch = new AbortController();
  const wecker = setTimeout(() => abbruch.abort(), 25000);
  try {
    const antwort = await fetch(SCRIPT_URL, {
      method: "POST",
      // text/plain vermeidet den CORS-Preflight, den Apps Script nicht beantwortet.
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(nutzlast),
      signal: abbruch.signal
    });
    const text = await antwort.text();
    try {
      return JSON.parse(text);
    } catch (e) {
      return { ok: false, error: "antwort" };   // meist eine Google-Fehlerseite
    }
  } finally {
    clearTimeout(wecker);
  }
}

function mockRuf(nutzlast) {
  return new Promise((fertig) => {
    setTimeout(() => {
      if (nutzlast.action === "kisten" || nutzlast.action === "kisten_setzen" ||
          nutzlast.action === "kiste_loeschen" || nutzlast.action === "kiste") {
        return fertig(mockKisten(nutzlast));
      }
      if (nutzlast.action === "gewuerze" || nutzlast.action === "gewuerz_setzen" ||
          nutzlast.action === "gewuerz_neu" || nutzlast.action === "gewuerz_loeschen") {
        return fertig(mockGewuerze(nutzlast));
      }
      const daten = lies(SPEICHER.mock, null) || mockStart();
      if (nutzlast.action === "add") {
        const betrag = Number(nutzlast.betrag);
        if (!isFinite(betrag) || betrag === 0) return fertig({ ok: false, error: "betrag" });
        if (!daten.buchungen.some((b) => b.id === nutzlast.id)) {
          daten.buchungen.push({
            id: nutzlast.id,
            ts: new Date().toISOString(),
            betrag: betrag,
            kommentar: String(nutzlast.kommentar || ""),
            wer: String(nutzlast.wer || "")

        }
        schreibe(SPEICHER.mock, daten);
      }
      const saldo = daten.buchungen.reduce((s, b) => s + b.betrag, daten.startSaldo);
      fertig({ ok: true, startSaldo: daten.startSaldo, saldo: saldo, buchungen: daten.buchungen });
    }, 450);
  });
}

/* --- Laden & Buchen ------------------------------------------------------- */
function ladeAnzeige(an) {
  laeuft = an;
  $("laden").classList.toggle("an", an);
  $("btn-neu").disabled = an;
}

async function ladeStand(still) {
  const code = lies(SPEICHER.code, "");
  if (!code) return;
  if (!still) ladeAnzeige(true);
  try {
    const antwort = await ruf({ action: "state", code: code });
    if (antwort && antwort.ok) {
      uebernimm(antwort);
    } else if (antwort && antwort.error === "code") {
      codeAbgelehnt();
    } else {
      standHinweis(true);
    }
  } catch (e) {
    standHinweis(true);
  } finally {
    ladeAnzeige(false);
  }
}

function uebernimm(antwort) {
  zustand = {
    startSaldo: Number(antwort.startSaldo) || 0,
    saldo: Number(antwort.saldo) || 0,
    buchungen: Array.isArray(antwort.buchungen) ? antwort.buchungen : []
  };
  standGeladenAm = new Date().toISOString();
  schreibe(SPEICHER.stand, { zustand: zustand, geladenAm: standGeladenAm });
  zeichne();
}

function standHinweis(fehler) {
  const el = $("stand");
  const geladenAm = bereich === "kisten" ? kistenGeladenAm
    : bereich === "gewuerze" ? gewuerzeGeladenAm
    : standGeladenAm;
  if (!geladenAm) {
    el.textContent = fehler ? "Kein Kontakt zum Sheet — bitte erneut aktualisieren." : "";
    return;
  }
  if (fehler) {
    el.textContent = "Kein Kontakt — Stand von " + zeitpunktText(geladenAm);
    return;
  }
  const alter = Date.now() - new Date(geladenAm).getTime();
  el.textContent = alter < 60000 ? "gerade aktualisiert" : "Stand von " + zeitpunktText(geladenAm);
}

async function buche() {
  const betrag = betragLesen($("betrag").value);
  if (!isFinite(betrag) || betrag <= 0) {
    blattFehler("Bitte einen Betrag eingeben, z. B. 12,50.");
    $("betrag").focus();
    return;
  }
  blattFehler("");
  $("btn-buchen").disabled = true;
  ladeAnzeige(true);
  const vorzeichenBetrag = modus === "ein" ? betrag : -betrag;
  try {
    const antwort = await ruf({
      action: "add",
      code: lies(SPEICHER.code, ""),
      id: laufendeId,
      betrag: vorzeichenBetrag,
      kommentar: $("kommentar").value.trim(),
      wer: lies(SPEICHER.wer, "")
    });
    if (antwort && antwort.ok) {
      uebernimm(antwort);
      overlayZu("buchen");
      toast(euroMitZeichen(vorzeichenBetrag) + " gebucht");
    } else if (antwort && antwort.error === "code") {
      overlayZu("buchen");
      codeAbgelehnt();
    } else if (antwort && antwort.error === "betrag") {
      blattFehler("Der Betrag wurde nicht akzeptiert.");
    } else {
      blattFehler("Nicht gebucht — bitte erneut versuchen.");
    }
  } catch (e) {
    blattFehler("Nicht gebucht — bitte erneut versuchen.");
  } finally {
    $("btn-buchen").disabled = false;
    ladeAnzeige(false);
  }
}

function codeAbgelehnt() {
  localStorage.removeItem(SPEICHER.code);
  einrichtenOeffnen("Der Familien-Code stimmt nicht. Bitte noch einmal eingeben.");
}

/* --- Zeichnen ------------------------------------------------------------- */
function zeichne() {
  $("saldo").textContent = zustand ? euro(zustand.saldo) : "—";
  standHinweis(false);

  const ziel = $("liste");
  if (!zustand) { ziel.innerHTML = ""; return; }

  const sortiert = zustand.buchungen
    .slice()
    .sort((a, b) => alsDatum(b.ts) - alsDatum(a.ts));

  if (sortiert.length === 0) {
    ziel.innerHTML = "";
    const leer = document.createElement("div");
    leer.className = "leer";
    leer.textContent = "Noch keine Buchungen. Startsaldo: " + euro(zustand.startSaldo) + ".";
    ziel.appendChild(leer);
    return;
  }

  // nach Monat gruppieren, neueste zuerst
  const gruppen = [];
  let aktuell = null;
  for (const b of sortiert) {
    const d = alsDatum(b.ts);
    const schluessel = isNaN(d) ? "?" : d.getFullYear() + "-" + d.getMonth();
    if (!aktuell || aktuell.schluessel !== schluessel) {
      aktuell = {
        schluessel: schluessel,
        titel: isNaN(d) ? "Ohne Datum" : monatFormat.format(d),
        summe: 0,
        eintraege: []
      };
      gruppen.push(aktuell);
    }
    aktuell.summe += Number(b.betrag) || 0;
    aktuell.eintraege.push(b);
  }

  const teil = document.createDocumentFragment();
  for (const g of gruppen) {
    const kopf = document.createElement("div");
    kopf.className = "monat";
    const name = document.createElement("span");
    name.textContent = g.titel;
    const summe = document.createElement("span");
    summe.className = "monat-summe zahl " + (g.summe < 0 ? "minus" : "plus");
    summe.textContent = euroMitZeichen(g.summe);
    kopf.append(name, summe);

    const box = document.createElement("div");
    box.className = "gruppe";
    for (const b of g.eintraege) box.appendChild(zeile(b));

    teil.append(kopf, box);
  }
  ziel.replaceChildren(teil);
}

function zeile(b) {
  const betrag = Number(b.betrag) || 0;
  const d = alsDatum(b.ts);

  const el = document.createElement("div");
  el.className = "buchung";

  const text = document.createElement("div");
  text.className = "buchung-text";

  const titel = document.createElement("div");
  const kommentar = String(b.kommentar || "").trim();
  titel.className = "buchung-titel" + (kommentar ? "" : " ohne");
  titel.textContent = kommentar || (betrag < 0 ? "Entnahme" : "Einzahlung");

  const meta = document.createElement("div");
  meta.className = "buchung-meta";
  const teile = [];
  if (!isNaN(d)) teile.push(datumFormat.format(d));
  const wer = String(b.wer || "").trim();
  if (wer) teile.push(wer);
  meta.textContent = teile.join(" · ");

  text.append(titel, meta);

  const zahl = document.createElement("div");
  zahl.className = "buchung-betrag zahl " + (betrag < 0 ? "minus" : "plus");
  zahl.textContent = euroMitZeichen(betrag);

  el.append(text, zahl);
  return el;
}

/* --- Kisten --------------------------------------------------------------- */

/**
 * Text zum Vergleichen einebnen: klein schreiben, Umlaute entzerren
 * („Küche“ → „kuche“). Die Länge bleibt dabei gleich — deshalb passen die
 * Positionen aus indexOf auch auf den Originaltext, was markiere() braucht.
 */
function flach(text) {
  const roh = String(text === null || text === undefined ? "" : text).toLowerCase();
  try {
    return roh.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  } catch (e) {
    return roh;   // sehr alte Engines: dann eben ohne Umlaut-Einebnung
  }
}

/** Steckt q in text? „ß“ und „ss“ gelten dabei als dasselbe. */
function passt(text, q) {
  if (!q) return true;
  const t = flach(text);
  if (t.indexOf(q) >= 0) return true;
  return t.replace(/ß/g, "ss").indexOf(q.replace(/ß/g, "ss")) >= 0;
}

/** Fundstellen im Text hervorheben. Findet nichts → gibt den Text unverändert. */
function markiere(text, q) {
  const teil = document.createDocumentFragment();
  const roh = String(text === null || text === undefined ? "" : text);
  if (!q) { teil.append(roh); return teil; }

  const eben = flach(roh);
  let ab = 0;
  let pos = eben.indexOf(q);
  while (pos >= 0) {
    if (pos > ab) teil.append(roh.slice(ab, pos));
    const m = document.createElement("mark");
    m.textContent = roh.slice(pos, pos + q.length);
    teil.append(m);
    ab = pos + q.length;
    pos = eben.indexOf(q, ab);
  }
  teil.append(roh.slice(ab));
  return teil;
}

function istFertig(k) {
  return String((k && k.status) || "") === "ausgepackt";
}

/** „lager“/„wohnung“ als Text; leer heißt: noch nicht festgelegt. */
function ortText(ort) {
  if (ort === "lager") return "Lager";
  if (ort === "wohnung") return "Wohnung";
  return "";
}

  kisten = {
    kisten: Array.isArray(antwort.kisten) ? antwort.kisten : [],
    sachen: Array.isArray(antwort.sachen) ? antwort.sachen : []
  };
  kistenGeladenAm = new Date().toISOString();
  schreibe(SPEICHER.kisten, { kisten: kisten, geladenAm: kistenGeladenAm });
  zeichneKisten();
  if (bereich === "kisten") standHinweis(false);
}

function gruppenKopf(titel, rechts) {
  const kopf = document.createElement("div");
  kopf.className = "monat";
  const links = document.createElement("span");
  links.textContent = titel;
  const seite = document.createElement("span");
  seite.className = "monat-summe";
  seite.textContent = rechts || "";
  kopf.append(links, seite);
  return kopf;
}

function leerText(text) {
  const el = document.createElement("div");
  el.className = "leer";
  el.textContent = text;
  return el;
}

function zeichneKisten() {
  const zahl = $("kisten-zahl");
  const ziel = $("kisten-liste");

  if (!kisten) {
    zahl.textContent = "—";
    $("kisten-balken").style.width = "0%";
    ziel.replaceChildren();
    return;
  }

  const alle = kisten.kisten.slice().sort(function (a, b) { return a.nr - b.nr; });
  const fertige = alle.filter(istFertig).length;

  zahl.replaceChildren();
  if (alle.length) {
    zahl.append(String(fertige) + " ");
    const rest = document.createElement("small");
    rest.textContent = "von " + alle.length + " ausgepackt";
    zahl.append(rest);
  } else {
    zahl.textContent = "—";
  }
  $("kisten-balken").style.width = alle.length
    ? Math.round(fertige / alle.length * 100) + "%"
    : "0%";

  const q = flach(suchtext.trim());
  const gefiltert = alle.filter(function (k) {
    if (kFilter === "offen" && istFertig(k)) return false;
    if (kFilter === "fertig" && !istFertig(k)) return false;
    if (ortFilter && k.ort !== ortFilter) return false;
    if (!q) return true;
    if (String(k.nr) === q) return true;
    if (passt(k.raum, q) || passt(k.notiz, q) || passt(k.text, q)) return true;
    return sachenDerKiste(k.nr).some(function (sa) { return passt(sa.sache, q); });
  });

  sichtbar = gefiltert.map(function (k) { return k.nr; });
  if (auswahlModus) {
    // Was der Filter ausblendet, darf nicht heimlich mitgeändert werden.
    for (const nr of Array.from(auswahl)) if (sichtbar.indexOf(nr) < 0) auswahl.delete(nr);
    auswahlLeiste();
  }

  if (!alle.length) {
    ziel.replaceChildren(leerText("Noch keine Kisten im Sheet. Sobald die Aufnahmen eingelesen sind, stehen sie hier."));
    return;
  }
  if (!gefiltert.length) {
    ziel.replaceChildren(leerText(q
      ? "Nichts gefunden für „" + suchtext.trim() + "“."
      : "In dieser Ansicht ist gerade nichts."));
    return;
  }

  const teil = document.createDocumentFragment();

  if (q) {
    teil.append(gruppenKopf(gefiltert.length === 1 ? "1 Treffer" : gefiltert.length + " Treffer", ""));
    const kasten = document.createElement("div");
    kasten.className = "gruppe";
    for (const k of gefiltert) kasten.appendChild(kistenZeile(k, q));
    teil.append(kasten);
  } else {
    // Ohne Suche nach Zielraum gruppieren — so packt man ein Zimmer am Stück aus.
    const namen = [];
    const nachRaum = Object.create(null);
    for (const k of gefiltert) {
      const name = k.raum || "Ohne Raum";
      if (!nachRaum[name]) { nachRaum[name] = []; namen.push(name); }
      nachRaum[name].push(k);
    }
    namen.sort(function (a, b) { return a.localeCompare(b, "de"); });
    for (const name of namen) {
      const liste = nachRaum[name];
      const offen = liste.filter(function (k) { return !istFertig(k); }).length;
      teil.append(gruppenKopf(name, offen ? offen + " offen" : "fertig"));
      const kasten = document.createElement("div");
      kasten.className = "gruppe";
      for (const k of liste) kasten.appendChild(kistenZeile(k, ""));
      teil.append(kasten);
    }
  }

  ziel.replaceChildren(teil);
}

function kistenZeile(k, q) {
  const fertig = istFertig(k);

  const el = document.createElement("div");
  el.className = "kiste" + (fertig ? " fertig" : "") + (auswahl.has(k.nr) ? " gewaehlt" : "");

  const haupt = document.createElement("button");
  haupt.type = "button";
  haupt.className = "kiste-haupt";
  haupt.dataset.nr = String(k.nr);
  haupt.setAttribute("aria-label", "Kiste " + k.nr + " öffnen");

  const nr = document.createElement("span");
  nr.className = "kiste-nr";
  nr.textContent = String(k.nr);

  const text = document.createElement("div");
  text.className = "kiste-text";

  // Oben steht der Inhalt, darunter der Raum: ohne Suche gruppiert die Liste
  // ohnehin nach Raum, und gesucht wird immer nach dem Gegenstand.
  const titel = document.createElement("div");
  titel.className = "kiste-titel";
  const sachen = sachenDerKiste(k.nr);
  const treffer = q ? sachen.filter(function (sa) { return passt(sa.sache, q); }) : [];
  const quelle = treffer.length ? treffer : sachen;
  const zeigen = quelle.slice(0, 3);
  if (zeigen.length) {
    zeigen.forEach(function (sa, i) {
      if (i) titel.append(", ");
      titel.append(markiere(sa.sache, q));
    });
    if (quelle.length > zeigen.length) titel.append(" +" + (quelle.length - zeigen.length));
  } else if (k.notiz) {
    titel.append(markiere(k.notiz, q));
  } else {
    titel.append(markiere(k.raum || "Kiste " + k.nr, q));
  }

  const meta = document.createElement("div");
  meta.className = "kiste-meta";
  const unten = [];
  if (zeigen.length || k.notiz) unten.push({ text: k.raum || "Ohne Raum", ort: false });
  if (ortText(k.ort)) unten.push({ text: ortText(k.ort), ort: true });
  if (zeigen.length && k.notiz) unten.push({ text: k.notiz, ort: false });
  unten.forEach(function (t, i) {
    if (i) meta.append(" · ");
    if (!t.ort) { meta.append(markiere(t.text, q)); return; }
    const fett = document.createElement("b");
    fett.className = "ort";
    fett.append(markiere(t.text, q));
    meta.append(fett);
  });

  text.append(titel, meta);
  haupt.append(nr, text);

  const haken = document.createElement("button");
  haken.type = "button";
  haken.className = "haken";
  haken.dataset.haken = String(k.nr);
  haken.setAttribute("aria-pressed", String(auswahlModus ? auswahl.has(k.nr) : fertig));
  haken.setAttribute("aria-label", auswahlModus
    ? "Kiste " + k.nr + " auswählen"
    : "Kiste " + k.nr + (fertig ? " wieder als offen" : " als ausgepackt") + " markieren");
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("aria-hidden", "true");
  const pfad = document.createElementNS("http://www.w3.org/2000/svg", "path");
  pfad.setAttribute("d", "M5 13l4 4 10-10");
  svg.append(pfad);
  haken.append(svg);

  el.append(haupt, haken);
  return el;
}

/** Füllt das Kisten-Blatt; öffnen macht kisteOeffnen. */
function kisteZeichnen(nr) {
  const k = kisten && kisten.kisten.find(function (x) { return x.nr === nr; });
  if (!k) return false;

  $("kiste-nr").textContent = String(k.nr);
  $("kiste-titel").textContent = k.raum || "Ohne Raum";

  const meta = [];
  if (k.notiz) meta.push(k.notiz);
  meta.push(istFertig(k) ? "ausgepackt" : "noch zu");
  $("kiste-meta").textContent = meta.join(" · ");

  const liste = $("kiste-sachen");
  liste.replaceChildren();
  for (const sa of sachenDerKiste(nr)) {
    const li = document.createElement("li");
    li.append(sa.sache);
    if (sa.zerbrechlich) {
      const z = document.createElement("span");
      z.className = "zerbrechlich";
      z.textContent = "zerbrechlich";
      li.append(z);
    }
    // Kategorie nur zeigen, wenn sie mehr sagt als der Raum darüber.
    if (sa.kategorie && sa.kategorie !== (k.raum || "")) {
      const kat = document.createElement("div");
      kat.className = "kat";
      kat.textContent = sa.kategorie;
      li.append(kat);
    }
    liste.append(li);
  }

  const txt = $("kiste-text");
  txt.textContent = k.text || "";
  txt.classList.toggle("versteckt", !k.text);

  for (const b of $("kiste-ort").querySelectorAll("button")) {
    b.setAttribute("aria-pressed", String(b.dataset.ort === k.ort));
  }

  $("btn-kiste-status").textContent = istFertig(k)
    ? "Wieder als offen markieren"
    : "Als ausgepackt markieren";
  loeschKnopfZuruecksetzen();
  return true;
}

function loeschKnopfZuruecksetzen() {
  clearTimeout(loeschTimer);
  loeschScharf = null;
  const knopf = $("btn-kiste-loeschen");
  knopf.classList.remove("scharf");
  knopf.textContent = "Kiste löschen";
}

/**
 * Löschen in zwei Schritten: der erste Tipp schärft den Knopf und benennt,
 * was verschwindet, der zweite löscht. Nach sechs Sekunden ohne Bestätigung
 * fällt er von selbst zurück.
 */
function loeschKnopfGetippt() {
  if (offeneKiste === null) return;

  if (loeschScharf !== offeneKiste) {
    loeschScharf = offeneKiste;
    const anzahl = sachenDerKiste(offeneKiste).length;
    const knopf = $("btn-kiste-loeschen");
    knopf.classList.add("scharf");
    knopf.textContent = anzahl
      ? "Wirklich löschen — mit " + anzahl + (anzahl === 1 ? " Gegenstand" : " Gegenständen")
      : "Wirklich löschen";
    clearTimeout(loeschTimer);
    loeschTimer = setTimeout(loeschKnopfZuruecksetzen, 6000);
    return;
  }

  kisteLoeschen(offeneKiste);
}

/** Kein Vorgriff auf die Anzeige: gelöscht wird erst, wenn das Sheet bestätigt. */
async function kisteLoeschen(nr) {
  loeschKnopfZuruecksetzen();
  const knopf = $("btn-kiste-loeschen");
  knopf.disabled = true;
  ladeAnzeige(true);
  try {
    const antwort = await ruf({
      action: "kiste_loeschen",
      code: lies(SPEICHER.code, ""),
      nr: nr
    });
    if (antwort && antwort.ok) {
      offeneKiste = null;
      auswahl.delete(nr);
      overlayZu("kiste");
      uebernimmKisten(antwort);
      auswahlLeiste();
      toast("Kiste " + nr + " gelöscht");
    } else if (antwort && antwort.error === "code") {
      overlayZu("kiste");
      codeAbgelehnt();
    } else {
      toast("Nicht gelöscht — bitte erneut versuchen.");
    }
  } catch (e) {
    toast("Nicht gelöscht — bitte erneut versuchen.");
  } finally {
    knopf.disabled = false;
    ladeAnzeige(false);
  }
}

function kisteOeffnen(nr) {
  if (!kisteZeichnen(nr)) return;
  offeneKiste = nr;
  overlayAuf("kiste");
}

/**
 * Setzt ein Feld (status oder ort) für eine oder viele Kisten.
 * Die Anzeige springt sofort um und wird nur zurückgedreht, wenn das Sheet
 * ablehnt — sonst hinge jedes Antippen am Apps-Script-Kaltstart.
 */
async function kistenSetzen(nrs, feld, wert) {
  if (!kisten || !nrs.length) return false;

  const betroffen = kisten.kisten.filter(function (k) { return nrs.indexOf(k.nr) >= 0; });
  if (!betroffen.length) return false;

  const vorher = betroffen.map(function (k) { return { kiste: k, wert: k[feld] }; });
  const zurueck = function () {
    for (const e of vorher) e.kiste[feld] = e.wert;
    zeichneKisten();
    if (offeneKiste !== null) kisteZeichnen(offeneKiste);
  };

  for (const k of betroffen) k[feld] = wert;
  zeichneKisten();
  if (offeneKiste !== null) kisteZeichnen(offeneKiste);

  const nutzlast = { action: "kisten_setzen", code: lies(SPEICHER.code, ""), nrs: nrs };
  nutzlast[feld] = wert;

  try {
    const antwort = await ruf(nutzlast);
    if (antwort && antwort.ok) {
      uebernimmKisten(antwort);
      if (offeneKiste !== null) kisteZeichnen(offeneKiste);
      return true;
    }
    zurueck();
    if (antwort && antwort.error === "code") codeAbgelehnt();
    else toast("Nicht gespeichert — bitte erneut versuchen.");
    return false;
  } catch (e) {
    zurueck();
    toast("Nicht gespeichert — bitte erneut versuchen.");
    return false;
  }
}

function kisteUmschalten(nr) {
  const k = kisten && kisten.kisten.find(function (x) { return x.nr === nr; });
  if (!k) return;
  kistenSetzen([nr], "status", istFertig(k) ? "" : "ausgepackt");
}

/* --- Mehrfachauswahl ------------------------------------------------------ */

function setzeAuswahlModus(an) {
  auswahlModus = !!an;
  auswahl.clear();
  $("kisten-liste").classList.toggle("waehlt", auswahlModus);
  $("btn-waehlen").setAttribute("aria-pressed", String(auswahlModus));
  $("btn-waehlen").textContent = auswahlModus ? "Fertig" : "Auswählen";
  auswahlLeiste();
  zeichneKisten();
}

function auswahlLeiste() {
  const anzahl = auswahl.size;
  $("auswahl-leiste").classList.toggle("versteckt", !(auswahlModus && bereich === "kisten"));
  $("auswahl-anzahl").textContent = anzahl === 1 ? "1 ausgewählt" : anzahl + " ausgewählt";
  $("btn-aendern").disabled = anzahl === 0;
  $("btn-alle").textContent = alleSichtbarenGewaehlt() ? "Keine" : "Alle";
}

function alleSichtbarenGewaehlt() {
  return sichtbar.length > 0 && sichtbar.every(function (nr) { return auswahl.has(nr); });
}

function auswahlUmschalten(nr) {
  if (auswahl.has(nr)) auswahl.delete(nr);
  else auswahl.add(nr);
  auswahlLeiste();
  zeichneKisten();
}

/* --- Gewürze & Co. -------------------------------------------------------- */

async function ladeGewuerze(still) {
  const code = lies(SPEICHER.code, "");
  if (!code) return;
  if (!still) ladeAnzeige(true);
  try {
    const antwort = await ruf({ action: "gewuerze", code: code });
    if (antwort && antwort.ok) {
      uebernimmGewuerze(antwort);
    } else if (antwort && antwort.error === "code") {
      codeAbgelehnt();
    } else {
      standHinweis(true);
    }
  } catch (e) {
    standHinweis(true);
  } finally {
    ladeAnzeige(false);
  }
}

function uebernimmGewuerze(antwort) {
  gewuerze = Array.isArray(antwort.gewuerze) ? antwort.gewuerze : [];
  gewuerzeGeladenAm = new Date().toISOString();
  schreibe(SPEICHER.gewuerze, { gewuerze: gewuerze, geladenAm: gewuerzeGeladenAm });
  zeichneGewuerze();
  if (offenesGewuerz !== null) gewuerzZeichnen(offenesGewuerz);
  if (bereich === "gewuerze") standHinweis(false);
}

function typText(typ) {
  if (typ === "Mischung") return "Mischungen";
  if (typ === "Einzeln") return "Einzelne Gewürze & Kräuter";
  return "Sonstiges";
}

function packungen(n) {
  if (n === 0) return "aufgebraucht";
  return n === 1 ? "1 Packung" : n + " Packungen";
}

function artVon(g) {
  return g.art === "sonstiges" || g.art === "einmalig" ? g.art : "gewuerz";
}

function artText(art) {
  if (art === "sonstiges") return "Alles andere";
  if (art === "einmalig") return "Nur für den Einkauf";
  return "Gewürz";
}

/** Steht auf der Einkaufsliste: Vorrat aufgebraucht oder Einmal-Position. */
function zuBesorgen(g) {
  return artVon(g) === "einmalig" || g.anzahl === 0;
}

function zeichneGewuerze() {
  const zahl = $("gewuerze-zahl");
  const ziel = $("gewuerze-liste");

  if (!gewuerze) {
    zahl.textContent = "—";
    ziel.replaceChildren();
    return;
  }

  const alle = gewuerze.slice().sort(function (a, b) { return a.name.localeCompare(b.name, "de"); });

  // Kopfzahl je Ansicht: Einkaufen zählt Offenes, Vorrat zählt Positionen und Packungen.
  zahl.replaceChildren();
  if (gFilter === "einkaufen") {
    const offen = alle.filter(zuBesorgen).length;
    zahl.append(String(offen) + " ");
    const rest = document.createElement("small");
    rest.textContent = offen === 1 ? "zu besorgen" : "zu besorgen";
    zahl.append(rest);
  } else {
    const eigene = alle.filter(function (g) { return artVon(g) === gFilter; });
    const summe = eigene.reduce(function (s, g) { return s + (g.anzahl || 0); }, 0);
    if (eigene.length) {
      zahl.append(String(eigene.length) + " ");
      const rest = document.createElement("small");
      rest.textContent = "Positionen · " + summe + " Packungen";
      zahl.append(rest);
    } else {
      zahl.textContent = "—";
    }
  }

  // Die Suche geht immer über alles, die Chips gelten nur ohne Suchtext.
  const q = flach(gSuchtext.trim());
  const gefiltert = alle.filter(function (g) {
    if (q) return passt(g.name, q) || passt(g.hersteller, q) || passt(g.zutaten, q) || passt(g.hinweis, q);
    if (gFilter === "einkaufen") return zuBesorgen(g);
    return artVon(g) === gFilter;
  });

  if (!gefiltert.length) {
    ziel.replaceChildren(leerText(q
      ? "Nichts gefunden für „" + gSuchtext.trim() + "“."
      : gFilter === "einkaufen"
        ? "Nichts zu besorgen. Aufgebrauchtes landet hier von selbst, Einmaliges über „+ Neu“."
        : gFilter === "sonstiges"
          ? "Noch nichts unter „Alles andere“. Über „+ Neu“ anlegen."
          : "Noch keine Gewürze im Sheet."));
    return;
  }

  const teil = document.createDocumentFragment();
  function gruppe(titel, liste, mitSuche) {
    if (!liste.length) return;
    const leer = liste.filter(function (g) { return g.anzahl === 0 && artVon(g) !== "einmalig"; }).length;
    teil.append(gruppenKopf(titel, gFilter === "einkaufen" || !leer ? String(liste.length) : leer + " zu besorgen"));
    const kasten = document.createElement("div");
    kasten.className = "gruppe";
    for (const g of liste) kasten.appendChild(gewuerzZeile(g, mitSuche ? q : ""));
    teil.append(kasten);
  }

  if (q) {
    teil.append(gruppenKopf(gefiltert.length === 1 ? "1 Treffer" : gefiltert.length + " Treffer", ""));
    const kasten = document.createElement("div");
    kasten.className = "gruppe";
    for (const g of gefiltert) kasten.appendChild(gewuerzZeile(g, q));
    teil.append(kasten);
  } else if (gFilter === "einkaufen") {
    // Einkaufsliste: erst Gewürze, dann Alles andere, dann Einmaliges.
    for (const art of ["gewuerz", "sonstiges", "einmalig"]) {
      gruppe(art === "gewuerz" ? "Gewürze" : art === "sonstiges" ? "Alles andere" : "Einmalig",
             gefiltert.filter(function (g) { return artVon(g) === art; }), false);
    }
  } else if (gFilter === "gewuerz") {
    // Gewürze nach Typ gruppieren: Mischungen zuerst, dann Einzelne, dann Sonstiges.
    for (const typ of ["Mischung", "Einzeln", "Sonstiges"]) {
      gruppe(typText(typ), gefiltert.filter(function (g) { return (g.typ || "Sonstiges") === typ; }), false);
    }
  } else {
    gruppe("Alles andere", gefiltert, false);
  }
  ziel.replaceChildren(teil);
}

/** Zutatenliste ab der Zutat, die den Treffer enthält; davor ein „…“. */
function zutatenAusschnitt(zutaten, q) {
  const eben = flach(zutaten);
  const pos = eben.indexOf(q);
  if (pos < 0) return zutaten;
  const komma = eben.lastIndexOf(",", pos);
  if (komma < 0) return zutaten;
  return "… " + zutaten.slice(komma + 1).trim();
}

function gewuerzZeile(g, q) {
  const art = artVon(g);
  const el = document.createElement("div");
  el.className = "kiste" + (g.anzahl === 0 && art !== "einmalig" ? " aufgebraucht" : "");

  const haupt = document.createElement("button");
  haupt.type = "button";
  haupt.className = "kiste-haupt";
  haupt.dataset.gnr = String(g.nr);
  haupt.setAttribute("aria-label", g.name + " öffnen");

  const nr = document.createElement("span");
  nr.className = "kiste-nr";
  if (art === "einmalig") {
    // Einmaliges hat keinen Bestand: Korb statt Zähler.
    nr.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10h18l-1.6 9a2 2 0 0 1-2 1.5H6.6a2 2 0 0 1-2-1.5z"/><path d="M8.5 10l3-6M15.5 10l-3-6"/></svg>';
  } else {
    nr.textContent = String(g.anzahl) + "×";
  }

  const text = document.createElement("div");
  text.className = "kiste-text";

  const titel = document.createElement("div");
  titel.className = "kiste-titel";
  titel.append(markiere(g.name, q));

  const meta = document.createElement("div");
  meta.className = "kiste-meta";
  const oben = [];
  if (g.hersteller) oben.push(g.hersteller);
  if (art === "einmalig") oben.push("nur für den Einkauf");
  else if (g.anzahl === 0) oben.push("zu besorgen");
  // In Suchtreffern steht dabei, wo eine Position hingehört.
  if (q && art === "sonstiges") oben.push("Alles andere");
  oben.forEach(function (t, i) {
    if (i) meta.append(" · ");
    meta.append(markiere(t, q));
  });
  // Trifft die Suche eine Zutat, die Zutatenliste ab der Fundstelle zeigen —
  // die Zeile ist einzeilig, der Treffer stünde sonst hinter dem „…“.
  if (q && g.zutaten && passt(g.zutaten, q) && !passt(g.name, q)) {
    const zut = document.createElement("span");
    zut.className = "zut";
    zut.append(markiere(zutatenAusschnitt(g.zutaten, q), q));
    meta.append(zut);
  }

  text.append(titel, meta);
  haupt.append(nr, text);
  el.append(haupt);

  // Rechts am Zeilenende: Plus holt Aufgebrauchtes in den Vorrat, Haken erledigt Einmaliges.
  if (art === "einmalig") {
    const haken = document.createElement("button");
    haken.type = "button";
    haken.className = "besorgen-plus";
    haken.dataset.gerledigt = String(g.nr);
    haken.setAttribute("aria-label", g.name + " erledigt, von der Einkaufsliste nehmen");
    haken.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
    el.append(haken);
  } else if (g.anzahl === 0) {
    const plus = document.createElement("button");
    plus.type = "button";
    plus.className = "besorgen-plus";
    plus.dataset.gplus = String(g.nr);
    plus.setAttribute("aria-label", g.name + " als gekauft in den Vorrat übernehmen");
    plus.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
    el.append(plus);
  }
  return el;
}

function packungenText(n) {
  return n === 0 ? "zu besorgen" : packungen(n);
}

function gewuerzZeichnen(nr) {
  const g = gewuerze && gewuerze.find(function (x) { return x.nr === nr; });
  if (!g) return false;

  const art = artVon(g);
  $("gewuerz-titel").textContent = g.name;
  const meta = [];
  if (g.hersteller) meta.push(g.hersteller);
  meta.push(art === "gewuerz" ? (g.typ || "Sonstiges") : artText(art));
  $("gewuerz-meta").textContent = meta.join(" · ");

  // Einmaliges hat keinen Bestand: statt Stepper ein Erledigt-Knopf.
  $("gewuerz-stepper").classList.toggle("versteckt", art === "einmalig");
  $("btn-gewuerz-erledigt").classList.toggle("versteckt", art !== "einmalig");

  $("gewuerz-anzahl").textContent = String(g.anzahl);
  $("gewuerz-anzahl-text").textContent = packungenText(g.anzahl);
  $("btn-gewuerz-minus").disabled = g.anzahl <= 0;
  $("btn-gewuerz-plus").disabled = g.anzahl >= 99;

  const zut = $("gewuerz-zutaten");
  zut.replaceChildren();
  if (g.zutaten) {
    const b = document.createElement("b");
    b.textContent = "Zutaten";
    zut.append(b, markiere(g.zutaten, flach(gSuchtext.trim())));
  }
  zut.classList.toggle("versteckt", !g.zutaten);

  const hin = $("gewuerz-hinweis");
  hin.textContent = g.hinweis || "";
  hin.classList.toggle("versteckt", !g.hinweis);

  const quelle = $("gewuerz-quelle");
  const istLink = /^https?:\/\//.test(g.quelle || "");
  quelle.href = istLink ? g.quelle : "#";
  quelle.textContent = istLink ? "Zur Quelle: " + g.quelle.replace(/^https?:\/\/(www\.)?/, "").split("/")[0] : "";
  quelle.classList.toggle("versteckt", !istLink);
  return true;
}

function gewuerzOeffnen(nr) {
  if (!gewuerzZeichnen(nr)) return;
  offenesGewuerz = nr;
  overlayAuf("gewuerz");
}

/** Anzahl ändern — optimistisch wie bei den Kisten. */
async function gewuerzSetzen(nr, anzahl) {
  const g = gewuerze && gewuerze.find(function (x) { return x.nr === nr; });
  if (!g || anzahl < 0 || anzahl > 99) return false;

  const vorher = g.anzahl;
  g.anzahl = anzahl;
  zeichneGewuerze();
  if (offenesGewuerz === nr) gewuerzZeichnen(nr);

  try {
    const antwort = await ruf({ action: "gewuerz_setzen", code: lies(SPEICHER.code, ""), nr: nr, anzahl: anzahl });
    if (antwort && antwort.ok) {
      uebernimmGewuerze(antwort);
      return true;
    }
    g.anzahl = vorher;
    zeichneGewuerze();
    if (offenesGewuerz === nr) gewuerzZeichnen(nr);
    if (antwort && antwort.error === "code") codeAbgelehnt();
    else toast("Nicht gespeichert — bitte erneut versuchen.");
    return false;
  } catch (e) {
    g.anzahl = vorher;
    zeichneGewuerze();
    if (offenesGewuerz === nr) gewuerzZeichnen(nr);
    toast("Nicht gespeichert — bitte erneut versuchen.");
    return false;
  }
}

/** Einmal-Position erledigen: optimistisch aus der Liste nehmen, Script löscht die Zeile. */
async function gewuerzErledigt(nr) {
  const g = gewuerze && gewuerze.find(function (x) { return x.nr === nr; });
  if (!g) return false;
  const vorher = gewuerze;
  gewuerze = gewuerze.filter(function (x) { return x.nr !== nr; });
  zeichneGewuerze();
  if (offenesGewuerz === nr) overlayZu("gewuerz");
  try {
    const antwort = await ruf({ action: "gewuerz_loeschen", code: lies(SPEICHER.code, ""), nr: nr });
    if (antwort && antwort.ok) {
      uebernimmGewuerze(antwort);
      toast("Erledigt: " + g.name, { text: "Rückgängig", tun: () => wiederAufListe(g) });
      return true;
    }
    gewuerze = vorher;
    zeichneGewuerze();
    if (antwort && antwort.error === "code") codeAbgelehnt();
    else toast("Nicht gespeichert — bitte erneut versuchen.");
    return false;
  } catch (e) {
    gewuerze = vorher;
    zeichneGewuerze();
    toast("Nicht gespeichert — bitte erneut versuchen.");
    return false;
  }
}

/** Rückgängig nach „Erledigt“: die gelöschte Einmal-Position wieder anlegen. */
async function wiederAufListe(g) {
  try {
    const antwort = await ruf({
      action: "gewuerz_neu", code: lies(SPEICHER.code, ""),
      name: g.name, hersteller: g.hersteller || "", hinweis: g.hinweis || "",
      art: "einmalig", typ: "Sonstiges", anzahl: 0, zutaten: ""
    });
    if (antwort && antwort.ok) {
      uebernimmGewuerze(antwort);
      toast("Wieder auf der Einkaufsliste: " + g.name);
    } else {
      toast("Nicht wiederhergestellt — bitte neu anlegen.");
    }
  } catch (e) {
    toast("Nicht wiederhergestellt — bitte neu anlegen.");
  }
}

/* Neu anlegen */

function gneuWahl(gruppe, attr, wert) {

/** Felder des Formulars je nach Art ein- und ausblenden. */
function gneuArtAnzeigen() {

  $("gneu-typ-feld").classList.toggle("versteckt", art !== "gewuerz");

  gneuWahl("gneu-wohin", "wohin", gFilter === "einkaufen" ? "besorgen" : "vorrat");

async function gneuAnlegen() {
  const name = $("gneu-name").value.trim();
  if (!name) {
    gneuFehler("Bitte einen Namen eingeben.");
    $("gneu-name").focus();
    return;
  }
  const art = $("gneu-art").querySelector('button[aria-pressed="true"]').dataset.art;
  const typ = $("gneu-typ").querySelector('button[aria-pressed="true"]').dataset.typ;
  const wohin = $("gneu-wohin").querySelector('button[aria-pressed="true"]').dataset.wohin;
  const aufListe = art === "einmalig" || wohin === "besorgen";
  const knopf = $("btn-gneu-anlegen");
  knopf.disabled = true;
  gneuFehler("");
  ladeAnzeige(true);
  try {
    const antwort = await ruf({
      action: "gewuerz_neu",
      code: lies(SPEICHER.code, ""),
      name: name,
      hersteller: $("gneu-hersteller").value.trim(),
      typ: art === "gewuerz" ? typ : "Sonstiges",
      art: art,
      anzahl: aufListe ? 0 : 1,
      zutaten: art === "gewuerz" ? $("gneu-zutaten").value.trim() : ""
    });
    if (antwort && antwort.ok) {
      overlayZu("gneu");
      uebernimmGewuerze(antwort);
      toast(aufListe ? "Auf der Einkaufsliste: " + name : "Im Vorrat: " + name);
    } else if (antwort && antwort.error === "doppelt") {
      gneuFehler("Gibt es schon" + (antwort.nr ? " (Nr. " + antwort.nr + ")" : "") + ". Anzahl dort ändern statt neu anlegen.");
    } else if (antwort && antwort.error === "code") {
      overlayZu("gneu");
      codeAbgelehnt();
    } else {
      gneuFehler("Nicht gespeichert — bitte erneut versuchen.");
    }
  } catch (e) {
    gneuFehler("Nicht gespeichert — bitte erneut versuchen.");
  } finally {
    knopf.disabled = false;
    ladeAnzeige(false);
  }
}

/** Reiter umschalten. laden=false beim Start, dort lädt aktualisiere(). */
function setzeBereich(neu, laden) {
  bereich = neu === "kisten" || neu === "gewuerze" ? neu : "spar";
  schreibe(SPEICHER.bereich, bereich);

  const istK = bereich === "kisten";
  const istG = bereich === "gewuerze";
  document.body.dataset.bereich = bereich;
  themeFarbe();
  for (const b of $("reiter").querySelectorAll("button")) {
    b.setAttribute("aria-selected", String(b.dataset.bereich === bereich));
  }
  $("kopf-spar").classList.toggle("versteckt", istK || istG);
  $("kopf-kisten").classList.toggle("versteckt", !istK);
  $("kopf-gewuerze").classList.toggle("versteckt", !istG);
  $("liste").classList.toggle("versteckt", istK || istG);
  $("kisten-liste").classList.toggle("versteckt", !istK);
  $("gewuerze-liste").classList.toggle("versteckt", !istG);
  $("aktionen").classList.toggle("versteckt", istK || istG);
  $("aktionen-vorrat").classList.toggle("versteckt", !istG);
  if (!istK && auswahlModus) setzeAuswahlModus(false);
  auswahlLeiste();
  $("liste-bereich").scrollTop = 0;
  standHinweis(false);

  if (laden !== false && lies(SPEICHER.code, "")) {
    if (istK && !kisten) ladeKisten(false);
    if (istG && !gewuerze) ladeGewuerze(false);
  }
}

/** iPhone-Statusleiste in der Akzentfarbe des Bereichs (theme-color folgt dem Kopf). */
function themeFarbe() {
  const stil = getComputedStyle(document.body);
  const dunkel = matchMedia("(prefers-color-scheme: dark)").matches;
  const farbe = stil.getPropertyValue(dunkel ? "--akzent-2" : "--akzent-1").trim();
  for (const m of document.querySelectorAll('meta[name="theme-color"]')) m.setAttribute("content", farbe);
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", themeFarbe);

/** Aktualisiert, was gerade sichtbar ist. */
function aktualisiere(still) {
  if (bereich === "kisten") return ladeKisten(still);
  if (bereich === "gewuerze") return ladeGewuerze(still);
  return ladeStand(still);
}

}

function overlayZu(id) {
  $(id).classList.remove("offen");

  if (aktiv && aktiv.blur) aktiv.blur();
}

}

/** Kurze Meldung unten. Mit aktion = { text, tun } erscheint ein Knopf (z. B. Rückgängig),
 *  die Meldung bleibt dann länger stehen. */
function toast(text, aktion) {
  const el = $("toast");
  el.replaceChildren(document.createTextNode(text));
  if (aktion) {
    const knopf = document.createElement("button");
    knopf.type = "button";
    knopf.textContent = aktion.text;
    knopf.addEventListener("click", () => {
      el.classList.remove("an");
      clearTimeout(toast.timer);
      aktion.tun();
    });
    el.append(knopf);
  }
  el.classList.add("an");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.classList.remove("an"), aktion ? 6000 : 2600);
}

/* Ziehen zum Aktualisieren ------------------------------------------------- */
(function ziehenZumLaden() {
  const bereich = $("liste-bereich");
  const anzeige = $("zieher");
  let startY = 0;
  let aktiv = false;
  let weg = 0;

  bereich.addEventListener("touchstart", (e) => {
    aktiv = bereich.scrollTop <= 0 && e.touches.length === 1 && !laeuft;
    startY = e.touches[0].clientY;
    weg = 0;
  }, { passive: true });

  bereich.addEventListener("touchmove", (e) => {
    if (!aktiv) return;
    const dy = e.touches[0].clientY - startY;
    if (dy <= 0) { aktiv = false; anzeige.style.height = "0px"; return; }
    e.preventDefault();
    weg = Math.min(dy * 0.5, 84);
    anzeige.style.height = weg + "px";
    anzeige.textContent = weg >= 56 ? "Loslassen zum Aktualisieren" : "Zum Aktualisieren ziehen";
  }, { passive: false });

  bereich.addEventListener("touchend", () => {
    if (!aktiv) return;
    aktiv = false;
    anzeige.style.height = "0px";
    if (weg >= 56) aktualisiere(false);
  }, { passive: true });
})();

/* Blatt nach unten wegziehen ----------------------------------------------- */
/*
 * Jedes Blatt lässt sich am oberen Rand nach unten schieben und schließt sich,
 * wenn man weit genug gezogen hat. Der Griff bleibt der sichtbare Hinweis,
 * die Schließen-Knöpfe bleiben ebenfalls.
 *
 * Losgezogen wird nur, wenn das Blatt schon ganz oben steht — sonst würde
 * die Geste den scrollbaren Inhalt festhalten.
 */
(function ziehenZumSchliessen() {
  const SCHWELLE = 90;

  for (const overlay of document.querySelectorAll(".overlay")) {
    const blatt = overlay.querySelector(".blatt");
    if (!blatt) continue;

    let startY = 0;
    let startX = 0;
    let weg = 0;
    let aktiv = false;
    let entschieden = false;

    blatt.addEventListener("touchstart", (e) => {
      aktiv = e.touches.length === 1 && blatt.scrollTop <= 0;
      entschieden = false;
      weg = 0;
      if (!aktiv) return;
      startY = e.touches[0].clientY;
      startX = e.touches[0].clientX;
      blatt.style.transition = "none";
    }, { passive: true });

    blatt.addEventListener("touchmove", (e) => {
      if (!aktiv) return;
      const dy = e.touches[0].clientY - startY;
      const dx = e.touches[0].clientX - startX;

      if (!entschieden) {
        if (Math.abs(dy) < 6 && Math.abs(dx) < 6) return;
        entschieden = true;
        // Nach oben wischen und waagerechte Gesten gehören dem Inhalt.
        if (dy <= 0 || Math.abs(dx) > Math.abs(dy)) {
          aktiv = false;
          blatt.style.transition = "";
          return;
        }
      }

      if (dy <= 0) {
        weg = 0;
        blatt.style.transform = "";
        return;
      }
      e.preventDefault();
      weg = dy;
      blatt.style.transform = "translateY(" + weg + "px)";
    }, { passive: false });

    const loslassen = () => {
      blatt.style.transition = "";
      blatt.style.transform = "";
      if (aktiv && weg > SCHWELLE) overlayZu(overlay.id);
      aktiv = false;
      weg = 0;
    };

    blatt.addEventListener("touchend", loslassen, { passive: true });
    blatt.addEventListener("touchcancel", loslassen, { passive: true });
  }
})();

/* Blatt über der iOS-Tastatur halten --------------------------------------- */
if (window.visualViewport) {
  const anpassen = () => {
    const vv = window.visualViewport;
    const platz = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    for (const el of document.querySelectorAll(".overlay")) {
      el.style.paddingBottom = platz + "px";
    }
  };
  window.visualViewport.addEventListener("resize", anpassen);
  window.visualViewport.addEventListener("scroll", anpassen);
}

/* --- Start ---------------------------------------------------------------- */
(function start() {
  if (MOCK) {
    const h = $("hinweis");
    h.textContent = "Vorschau mit Beispieldaten — noch nicht mit dem Sheet verbunden.";
    h.classList.remove("versteckt");
  }

  const zwischenspeicher = lies(SPEICHER.stand, null);
  if (zwischenspeicher && zwischenspeicher.zustand) {
    zustand = zwischenspeicher.zustand;
    standGeladenAm = zwischenspeicher.geladenAm;
    zeichne();
  }

  const kistenSpeicher = lies(SPEICHER.kisten, null);
  if (kistenSpeicher && kistenSpeicher.kisten) {
    kisten = kistenSpeicher.kisten;
    kistenGeladenAm = kistenSpeicher.geladenAm;
    zeichneKisten();
  }

  // Beim Öffnen immer die Einkaufsliste — das ist der häufigste Griff (Indir, 28.09.2026).
  setzeGFilter("einkaufen");
  const gewuerzeSpeicher = lies(SPEICHER.gewuerze, null);
  if (gewuerzeSpeicher && gewuerzeSpeicher.gewuerze) {
    gewuerze = gewuerzeSpeicher.gewuerze;
    gewuerzeGeladenAm = gewuerzeSpeicher.geladenAm;
    zeichneGewuerze();
  }

  // Beim Öffnen immer der Vorrat, unabhängig vom letzten Reiter.
  setzeBereich("gewuerze", false);

  if (!lies(SPEICHER.code, "")) {
    einrichtenOeffnen("");
  } else {
    aktualisiere(false);
  }

  // Beim Zurückkehren zur App frisch laden.
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && lies(SPEICHER.code, "")) aktualisiere(true);
  });

  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    navigator.serviceWorker.register("sw.js").catch(() => { /* ohne SW läuft die App auch */ });
  }
})();
</script>
